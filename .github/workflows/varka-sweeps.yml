# The exhaustive sweeps (VARKA-573, VARKA-573.md): every test that reads -Dvarka.sweep or
# -Dvarka.sweep.long, listed in sql/varka/ci/sweeps.tsv, each as its own job on an x86 and an Arm
# runner. A sweep is the only complete check of an operator over a 32-bit domain, and no other
# workflow runs one. One job builds the test classes once and archives their classpath
# (dev/varka_matrix_archive.sh, as the option matrix does); dev/varka_sweeps.py --matrix lists
# the jobs, and each runs the project's own runner, VarkaSuiteRunner, with a -z for each of its
# shard's texts, the property set and -Dvarka.ownJvm=true: without that property a JUnit suite
# forks a child JVM that runs the whole suite and ignores the -z. A failure turns the job red and
# its JUnit reports are kept.
#
# Every Saturday at 02:00 UTC, by the owner's word of 6 November 2026, and on dispatch. The sweeps
# run over fixed domains, so their result changes only when the code under test does, and a week
# is as often as a change can matter. The calibration of 6 November 2026 (VARKA-573.md 10.5) found
# a runner no more than 3.7 times slower than the laptop's 24 threads on any sweep timed, the
# narrow-integer shards 1.0 to 1.4 times, so the longest job takes under about an hour and every row
# of the manifest names this workflow in its `job` column.
#
# Beside the sweeps, every Saturday by the owner's word of 10 November 2026 (VARKA-564): the Varka
# suites at the defaults under -XX:UseAVX=2 -XX:MaxVectorSize=16, the EPYC 7763 benchmark runners'
# width, from the same classpath, in six jobs (each module in three shares by the committed
# weights, as the Build splits them). On 4 November 2026 that run failed 19 tests on master that
# no other run saw, because the option matrix's 128-bit platform forces only MaxVectorSize=16 and
# so meets AVX2's lowering only on the runs that draw an AVX2 host. On an AVX-512 runner the flags
# make the JVM emulate AVX2; on an AVX2 one they are its own; either checks the same lowering.
name: Varka sweeps

on:
  schedule:
    # Saturday 02:00 UTC.
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      suite:
        description: 'One suite of sql/varka/ci/sweeps.tsv by its simple name; every row when empty. The calibration runs one.'
        required: false
        default: ''
      runners:
        description: 'Which runners: both, x86 (ubuntu-latest) or arm (ubuntu-24.04-arm)'
        required: false
        default: 'both'
      rows:
        description: 'all: every row of the manifest; scheduled: only the rows whose job names this workflow'
        required: false
        default: 'all'
      avx2_128:
        description: 'The suites under -XX:UseAVX=2 -XX:MaxVectorSize=16: no, also (beside the sweeps) or only. A scheduled run always runs them beside the sweeps.'
        required: false
        default: 'no'

jobs:
  build:
    name: "Sweeps: build and plan"
    # Never on apache/spark, whose tree has no Varka. The schedule runs on vecbricks/varka only:
    # the fork's master follows this project's by a manual sync, and a failure there reports
    # nowhere. A dispatch runs on either repository.
    if: >-
      github.repository != 'apache/spark'
      && (github.event_name != 'schedule' || github.repository == 'vecbricks/varka')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sweeps: ${{ steps.plan.outputs.sweeps }}
      runners: ${{ steps.plan.outputs.runners }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache SBT and Maven
      uses: actions/cache@v4
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
        restore-keys: |
          build-
    - name: Cache Coursier local repository
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: varka-sweeps-coursier-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
        restore-keys: |
          varka-sweeps-coursier-
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Install the Varka engine
      uses: ./.github/actions/install-varka-engine
    # The manifest's own check first: a sweep it does not list, or lists wrongly, fails here and
    # not as a silent absence from the night.
    - name: Check the sweep manifest and plan the jobs
      id: plan
      env:
        SUITE: ${{ inputs.suite }}
        RUNNERS: ${{ inputs.runners }}
        ROWS: ${{ inputs.rows }}
        AVX2_128: ${{ inputs.avx2_128 }}
      run: |
        case "${AVX2_128:-no}" in
          no|also|only) ;;
          *) echo "::error::avx2_128 is no, also or only"; exit 1 ;;
        esac
        python3 dev/varka_sweeps.py --check
        # A scheduled run takes the rows that name this workflow; a dispatch takes every row
        # unless it asks for the scheduled ones.
        all=(--all)
        if [ "${ROWS:-all}" = scheduled ] || [ "$GITHUB_EVENT_NAME" = schedule ]; then all=(); fi
        suite=(); [ -z "$SUITE" ] || suite=(--suite "$SUITE")
        sweeps=$(python3 dev/varka_sweeps.py --matrix "${all[@]}" "${suite[@]}")
        [ "$sweeps" != '[]' ] || { echo "::error::no sweep row matches"; exit 1; }
        case "${RUNNERS:-both}" in
          both) runners='["ubuntu-latest","ubuntu-24.04-arm"]' ;;
          x86) runners='["ubuntu-latest"]' ;;
          arm) runners='["ubuntu-24.04-arm"]' ;;
          *) echo "::error::runners is both, x86 or arm"; exit 1 ;;
        esac
        echo "sweeps=$sweeps" >> "$GITHUB_OUTPUT"
        echo "runners=$runners" >> "$GITHUB_OUTPUT"
        {
          echo "## Sweeps: $(jq length <<< "$sweeps") rows on $runners"
          jq -r '.[] | "- " + .label + " (" + .property + ")"' <<< "$sweeps"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Build the test classes
      run: ./dev/varka_matrix.sh --build-only --sbt-arg -Phive --out target/varka-sweeps
    - name: Archive the classpath
      run: ./dev/varka_matrix_archive.sh pack target/varka-sweeps target/varka-sweeps.tar
    - name: Upload the classpath
      uses: actions/upload-artifact@v4
      with:
        name: varka-sweeps-build
        path: target/varka-sweeps.tar
        retention-days: 1
        compression-level: 1

  sweep:
    name: "Sweep: ${{ matrix.sweep.label }} on ${{ matrix.runner }}"
    needs: build
    if: inputs.avx2_128 != 'only'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        sweep: ${{ fromJSON(needs.build.outputs.sweeps) }}
        runner: ${{ fromJSON(needs.build.outputs.runners) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    # The machine each time is a fact of the result: the pool mixes AVX2 and AVX-512 hosts.
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/varka-sweep-run/platform
    - name: Download the classpath
      uses: actions/download-artifact@v4
      with:
        name: varka-sweeps-build
        path: target
    - name: Unpack the classpath
      run: |
        ./dev/varka_matrix_archive.sh unpack target/varka-sweeps.tar target/varka-sweeps
        rm target/varka-sweeps.tar
    # One JVM, as dev/varka_matrix.sh runs one: the exported options and classpath, the runner,
    # and the sweep's own property, caps and -z texts from the manifest.
    - name: Run the sweep
      env:
        ENTRY: ${{ toJSON(matrix.sweep) }}
      run: |
        set -uo pipefail
        dir=target/varka-sweep-run
        mkdir -p "$dir/tmp"
        CP=$(cat target/varka-sweeps/classpath)
        mapfile -t OPTS < target/varka-sweeps/jvm.opts
        mapfile -t JVM < <(python3 dev/varka_sweeps.py --jvm-args "$ENTRY")
        mapfile -t ARGS < <(python3 dev/varka_sweeps.py --runner-args "$ENTRY")
        start=$SECONDS
        SPARK_TESTING=1 SPARK_SCALA_VERSION=2.13 java "${OPTS[@]}" "${JVM[@]}" \
          -Djava.io.tmpdir="$dir/tmp" -cp "$CP" \
          org.apache.spark.sql.catalyst.expressions.codegen.varka.VarkaSuiteRunner \
          -oW -u "$dir/junit" "${ARGS[@]}" 2>&1 | tee "$dir/run.log"
        status=${PIPESTATUS[0]}
        {
          echo "## ${{ matrix.sweep.label }} on ${{ matrix.runner }}: exit $status, $((SECONDS - start)) s"
          grep -E "Tests: succeeded|FAILED|^failed " "$dir/run.log" | head -20 || true
        } >> "$GITHUB_STEP_SUMMARY"
        echo "$((SECONDS - start))" > "$dir/seconds"
        exit "$status"
    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-sweep-${{ strategy.job-index }}
        path: |
          target/varka-sweep-run/run.log
          target/varka-sweep-run/seconds
          target/varka-sweep-run/platform/platform.txt
          target/varka-sweep-run/junit/*.xml
        if-no-files-found: ignore
        retention-days: 30

  # The Varka suites at the defaults under AVX2 at 128 bits (VARKA-564), the run of
  # `dev/varka_matrix.sh --defaults --jvm-arg -XX:UseAVX=2 --jvm-arg -XX:MaxVectorSize=16` that
  # passed on master 1ab398dad18, split into each module's three shares by the committed weights
  # (dev/varka_suite_shards.py --job), each share over two JVMs on the runner's four cores.
  avx2-128:
    name: "AVX2 at 128 bits: ${{ matrix.module }} ${{ matrix.part }}"
    needs: build
    if: >-
      github.event_name == 'schedule' || inputs.avx2_128 == 'also'
      || inputs.avx2_128 == 'only'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: [catalyst, sql]
        part: [0/3, 1/3, 2/3]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    # The host's own UseAVX and vector width, which the summary's reader needs: on an AVX2 host
    # the flags change nothing, on an AVX-512 one they emulate AVX2.
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/varka-avx2-128/platform
    - name: Download the classpath
      uses: actions/download-artifact@v4
      with:
        name: varka-sweeps-build
        path: target
    - name: Unpack the classpath
      run: |
        ./dev/varka_matrix_archive.sh unpack target/varka-sweeps.tar target/varka-sweeps
        rm target/varka-sweeps.tar
    - name: Run this share under AVX2 at 128 bits
      env:
        MODULE: ${{ matrix.module }}
        PART: ${{ matrix.part }}
      run: |
        set -o pipefail
        mapfile -t all < <(./dev/varka_matrix.sh --defaults --list-suites --module "$MODULE" \
          | sed 's/^@own //')
        [ ${#all[@]} -gt 0 ] || { echo "::error::no suite of $MODULE"; exit 1; }
        mine=$(python3 dev/varka_suite_shards.py --job "$PART" sql/varka/ci/suite-times.tsv \
          "${all[@]}" | sed 's/.*\.//' | paste -sd, -)
        [ -n "$mine" ] || { echo "::error::share $PART of $MODULE is empty"; exit 1; }
        echo "== share $PART of $MODULE: $mine"
        status=0
        ./dev/varka_matrix.sh --defaults --skip-build --build-dir target/varka-sweeps \
          --out target/varka-avx2-128 --module "$MODULE" --suites "$mine" --split 2 -j 2 \
          --split-weights sql/varka/ci/suite-times.tsv \
          --jvm-arg -XX:UseAVX=2 --jvm-arg -XX:MaxVectorSize=16 || status=$?
        {
          echo "## AVX2 at 128 bits: $MODULE $PART, exit $status"
          grep -h '^CPU\|^JVM' target/varka-avx2-128/platform/platform.txt || true
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-avx2-128-${{ strategy.job-index }}
        path: |
          target/varka-avx2-128/platform/platform.txt
          target/varka-avx2-128/runs/*/*/run.log
          target/varka-avx2-128/runs/*/*/exit
          target/varka-avx2-128/runs/*/*/junit/*.xml
        if-no-files-found: ignore
        retention-days: 30

  report-failure:
    name: Report a failed run
    # Only a scheduled run, since a person who dispatches one sees its result; only on the
    # project's own repository, where issues are on; and when a job failed or was cancelled.
    needs: [build, sweep, avx2-128]
    if: >-
      always() && github.event_name == 'schedule' && github.repository == 'vecbricks/varka'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          dev
    - name: Report the failure
      uses: ./.github/actions/report-scheduled-failure
      with:
        needs: ${{ toJSON(needs) }}
