# Take the width audit's census (VarkaWidthAuditSuite, VARKA-153) and the operator census
# (VarkaOperatorCensusSuite, VARKA-376) on each runner
# architecture the pool offers, and publish it as an artifact and a summary. The
# census says, per vector width a host can run, which Vector API calls C2 refuses to
# lower in Varka's kernels; the committed sql/varka/width_audit.json is one x86
# laptop's, and the fleet's 128-bit hosts are aarch64, where the 64-bit lane's
# masks were never looked at. Unlike the canary workflow this needs the catalyst
# test classes, so it builds them: about half an hour on a cold runner.
#
# The suite's invariant - nothing refused at the host's own width, the 64-bit
# converts below AVX-512 excepted - is expected to fail on a host where the
# story differs, and that failure is the finding, so the step continues and the
# census is written and uploaded either way. Nothing here is committed: a
# census is a property of the CPU and the JDK, and the committed file stays the
# laptop's; what a runner measured is recorded in the plan by hand from the
# artifact.
name: Varka width audit

on:
  push:
    paths:
      - '.github/workflows/varka-width-audit.yml'
      - 'sql/catalyst/src/test/scala/org/apache/spark/sql/catalyst/expressions/codegen/varka/VarkaWidthAudit*.scala'
      - 'sql/catalyst/src/test/java/org/apache/spark/sql/catalyst/expressions/codegen/varka/VarkaOperatorCensus*.java'
  workflow_dispatch:

jobs:
  audit:
    name: "Width audit on ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
    - name: Checkout Varka
      uses: actions/checkout@v6
    - name: Install JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Cache the build's dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/coursier
          ~/.ivy2
          ~/.sbt
        key: varka-width-audit-${{ matrix.arch }}-${{ hashFiles('project/**', 'pom.xml') }}
        restore-keys: varka-width-audit-${{ matrix.arch }}-
    - name: Describe the machine
      run: |
        echo "## Width audit on ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
        {
          echo '```'
          grep -m1 -E 'model name|^CPU part|^Model' /proc/cpuinfo || true
          # aarch64 has no model name in cpuinfo, only the part number; 0xd49 is Neoverse N2.
          grep -m1 -E '^CPU implementer' /proc/cpuinfo || true
          grep -m1 -oE 'avx512[a-z]*|asimd|sve[0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' ' || true
          echo
          java -version 2>&1 | head -1
          java -XX:+PrintFlagsFinal -version 2>/dev/null | grep -E ' (MaxVectorSize|UseAVX|UseSVE) ' || true
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Take the census
      # The regeneration writes this host's census over the committed file in the checkout;
      # the failure of the invariant on a host where the story differs is the finding, so the
      # step continues and the summary below reads the file either way.
      continue-on-error: true
      env:
        VARKA_AUDIT_REGEN: "true"
      run: ./build/sbt "catalyst/testOnly *VarkaWidthAuditSuite" 2>&1 | tail -60
    - name: Summarise the census
      run: |
        python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
        import json, re
        d = json.load(open("sql/varka/width_audit.json"))
        h = d["host"]
        print(f"### {h['cpu']} ({h['arch']}), preferred {h['preferred_bits']} bits, UseAVX {h['use_avx']}")
        def construction(line):
            for key, name in (("op=comp", "compare to mask"), ("op=blend", "blend"), ("op=cast", "cast"),
                              ("op=broadcast", "broadcast"), ("op=test", "mask test"), ("is_masked_op=1", "masked op"),
                              ("ismask=1", "mask logic"), ("op=load", "load/store"), ("op=store", "load/store")):
                if key in line: return name
            return "other"
        # Only a 'not supported' line is a refusal; C2's 'missing constant' and 'unbox failed'
        # lines are timing (VARKA-154) and are counted apart so the summary cannot mistake them.
        for bits, shapes in d["widths"].items():
            refused = {s: [l for l in lines if l.startswith("not supported")] for s, lines in shapes.items()}
            refused = {s: ls for s, ls in refused.items() if ls}
            other = sum(1 for lines in shapes.values() for l in lines if not l.startswith("not supported"))
            print(f"\n**{bits} bits**: {len(refused)} of {len(shapes)} shapes have a refusal"
                  f" ({other} non-verdict lines left aside)")
            for s, lines in sorted(refused.items()):
                cs = sorted({construction(l) for l in lines})
                print(f"- `{s}`: {', '.join(cs)}")
        PY
    - name: Upload the census
      uses: actions/upload-artifact@v4
      with:
        name: width-audit-${{ matrix.arch }}
        path: sql/varka/width_audit.json
    - name: Take the operator census
      # The operator census (VarkaOperatorCensusSuite) asks per operator, not per kernel shape,
      # whether C2 lowers a loop of it to a vector instruction at each species this host runs
      # and whether the loop allocates. The regeneration writes this host's cells over the
      # committed laptop file in the checkout, and a cell that reads F here is the finding, so the
      # step continues and the summary reads the file either way. It forks about 250 short JVMs.
      continue-on-error: true
      timeout-minutes: 30
      env:
        VARKA_CENSUS_REGEN: "true"
      run: |
        # The committed file is the laptop's; a run that dies before writing leaves none to upload.
        rm -f sql/varka/operator_census.json
        ./build/sbt "catalyst/testOnly *VarkaOperatorCensusSuite" 2>&1 | tail -40
    - name: Summarise the operator census
      run: |
        python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
        import json
        d = json.load(open("sql/varka/operator_census.json"))
        h = d["host"]
        print(f"### Operator census: {h['cpu']} ({h['arch']})")
        for bits, cells in d["widths"].items():
            odd = {n: c for n, c in cells.items() if c["verdict"] not in ("I", "-")}
            print(f"\n**{bits} bits**: {len(cells) - len(odd)} of {len(cells)} cells intrinsic and allocation-free")
            for n, c in sorted(odd.items()):
                print(f"- `{n}`: {c['verdict']}, {c.get('bytes_per_row', 0)} bytes a row"
                      f" ({', '.join(c.get('failed', [])) or 'allocating'})")
        PY
    - name: Upload the operator census
      uses: actions/upload-artifact@v4
      with:
        name: operator-census-${{ matrix.arch }}
        path: sql/varka/operator_census.json
