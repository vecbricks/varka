# Spark's full module matrix on this project's master, once a week (VARKA-177,
# VARKA-179.md section 5). A change confined to Varka's files runs only the Varka
# suites on its pull request, and after the merge varka-master.yml runs only Varka's
# jobs, the linters and the Maven build: build_main.yml skips pushes to master on forks
# and Spark's scheduled builds are apache/spark-only. So without this file the last full
# matrix a Varka-scoped change ever sees is the one of the last pull request that
# touched a Spark file. Sunday, early, when no pull request is using the runner slots.
#
# The jobs are named rather than left to the precondition (VARKA-255.md 2.5, 2.9): on
# master the precondition diffs the head against itself, finds no change and selects
# nothing, so until VARKA-255 this run built only the linters, the docs and the Java 25
# Maven build. The set is build_java25.yml's, with the pandas-on-Spark, old Connect
# client and periodic PySpark groups, lint, java25, docs and Varka's jobs added - what a
# pull request touching a shared file runs - and the Kubernetes and OIDC jobs off, as
# build_and_test.yml switches them off on this fork; an explicit set bypasses that line.
# The module jobs then test every module they name: dev/run-tests.py reads a diff base
# equal to the head as no change to measure.
name: "Build / Weekly full matrix (Scala 2.13, JDK 25)"

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and test'
        required: false
        default: 'master'

jobs:
  run-build:
    permissions:
      packages: write
    name: Run
    uses: ./.github/workflows/build_and_test.yml
    if: github.repository != 'apache/spark'
    with:
      java: 25
      branch: ${{ github.event.inputs.branch || 'master' }}
      hadoop: hadoop3
      jobs: >-
        {
          "build": "true",
          "pyspark": "true",
          "pyspark-pandas": "true",
          "pyspark-connect-old-client": "true",
          "pyspark-periodic": "true",
          "sparkr": "true",
          "tpcds-1g": "true",
          "docker-integration-tests": "true",
          "yarn": "true",
          "k8s-integration-tests": "false",
          "oidc-e2e": "false",
          "buf": "true",
          "ui": "true",
          "lint": "true",
          "java25": "true",
          "docs": "true",
          "varka-scoped": "true",
          "varka-engine": "true",
          "varka-bench": "true",
          "varka-asm": "true",
          "varka-docs": "true"
        }

  report-failure:
    name: Report a failed run
    # Only a scheduled run, since a person who dispatches one sees its result; only on the
    # project's own repository, where issues are on; and for a failed or cancelled job, a
    # job past its timeout-minutes ending as cancelled.
    needs: [run-build]
    if: >-
      always() && github.event_name == 'schedule' && github.repository == 'vecbricks/varka'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          dev
    - name: Report the failure
      uses: ./.github/actions/report-scheduled-failure
