# Spark's full module matrix on this project's master, once a week (task 177,
# PLAN_TASK_179.md section 5). A change confined to Varka's files runs only the Varka
# suites on its pull request, and after the merge nothing runs at all: build_main.yml
# skips pushes to master on forks and Spark's scheduled builds are apache/spark-only.
# So without this file the last full matrix a Varka-scoped change ever sees is the one
# of the last pull request that touched a Spark file. Sunday, early, when no pull
# request is using the runner slots.
name: "Build / Weekly full matrix (Scala 2.13, JDK 25)"

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and test'
        required: false
        default: 'master'

jobs:
  run-build:
    permissions:
      packages: write
    name: Run
    uses: ./.github/workflows/build_and_test.yml
    if: github.repository != 'apache/spark'
    with:
      java: 25
      branch: ${{ github.event.inputs.branch || 'master' }}
      hadoop: hadoop3
