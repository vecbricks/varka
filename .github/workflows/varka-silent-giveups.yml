# Runs the spark-shell scripts under sql/varka/demo/silent-giveups/ - the snippets of the post on
# where Spark gives up whole-stage codegen (PLAN_TASK_233.md 10.3 and 10.5) - on the stock Spark
# distribution under each JDK Spark supports, and uploads what each prints. Like varka-demo.yml it
# needs no build of this repository: the scripts run the way a reader runs them. Each output keeps
# the script's own lines, from its first "###" on, with the runner's CPU and the versions above.
#
# It runs when a push changes the scripts, and by hand.

name: Varka silent give-ups

on:
  workflow_dispatch:
  push:
    paths:
      - 'sql/varka/demo/silent-giveups/*.scala'
      - '.github/workflows/varka-silent-giveups.yml'

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    env:
      STOCK_VERSION: 4.2.0
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Java ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: ${{ matrix.java }}

    - name: Restore the stock Spark distribution
      id: cache-stock
      uses: actions/cache/restore@v5
      with:
        path: ~/stock-spark
        key: stock-spark-${{ env.STOCK_VERSION }}-hadoop3

    # The download step of varka-surface-benchmark.yml, falling back to the Apache archive
    # once the mirror has dropped the release.
    - name: Download the stock Spark distribution
      if: ${{ steps.cache-stock.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        mkdir -p ~/stock-spark && cd ~/stock-spark
        TGZ="spark-${STOCK_VERSION}-bin-hadoop3.tgz"
        BASE="https://dlcdn.apache.org/spark/spark-${STOCK_VERSION}"
        curl -fsSLO "$BASE/$TGZ" || {
          BASE="https://archive.apache.org/dist/spark/spark-${STOCK_VERSION}"
          curl -fsSLO "$BASE/$TGZ"
        }
        curl -fsSLO "$BASE/$TGZ.sha512"
        WANT="$(tr -d ' \n' < "$TGZ.sha512" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{128}' | head -1)"
        GOT="$(sha512sum "$TGZ" | cut -d' ' -f1)"
        if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
          echo "::error::checksum mismatch for $TGZ (want '$WANT' got '$GOT')"
          exit 1
        fi
        tar -xzf "$TGZ" && rm -f "$TGZ" "$TGZ.sha512"

    - name: Save the stock Spark distribution
      if: ${{ steps.cache-stock.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ~/stock-spark
        key: stock-spark-${{ env.STOCK_VERSION }}-hadoop3

    - name: Run the scripts
      run: |
        set -uo pipefail
        SPARK="$HOME/stock-spark/spark-${STOCK_VERSION}-bin-hadoop3"
        cd sql/varka/demo/silent-giveups
        status=0
        for script in *.scala; do
          name="${script%.scala}"
          "$SPARK/bin/spark-shell" --master 'local[1]' --driver-memory 2g \
            --conf spark.ui.enabled=false --conf spark.ui.showConsoleProgress=false \
            -i "$script" > "$name.log" 2>&1 < /dev/null || true
          out="$name-jdk${{ matrix.java }}-output.txt"
          {
            echo "Output of $script on a GitHub-hosted runner, by varka-silent-giveups.yml."
            echo "run:     ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit:  ${GITHUB_SHA::11}"
            echo "cpu:     $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            echo "java:    $(java -version 2>&1 | head -1)"
            echo "spark:   ${STOCK_VERSION}"
            echo
            # Lines are cut at 300 characters, except the per-query series a reader recomputes
            # the wait from.
            sed -n '/^###/,$p' "$name.log" \
              | awk '/^ms per query:/ || length <= 300 { print; next } { print substr($0, 1, 300) }'
          } > "$out"
          cat "$out"
          grep -q '^### Spark' "$out" || { echo "::error::$script did not finish"; status=1; }
        done
        exit $status

    - name: Upload the outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: varka-silent-giveups-jdk${{ matrix.java }}
        path: |
          sql/varka/demo/silent-giveups/*-output.txt
          sql/varka/demo/silent-giveups/*.log
