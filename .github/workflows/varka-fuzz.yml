# The Varka fuzzers as a standing job (VARKA-179, VARKA-179.md). Every night this
# runs the IR fuzzer - random IR trees emitted, run and checked against the reference
# evaluator - in one JVM per runner core with a seed of its own, and the coverage
# composition fuzzer - random wide projections and filters of the coverage table through
# the compiler - once. The seeds come from the date, so each night visits new trees and
# a failure replays with the seed and iteration the log names. The suites' own defaults
# stay small so that a pull request pays seconds; the night pays minutes.
name: Varka fuzz

on:
  schedule:
    # 02:00 UTC, after the day's pull requests and before the next morning's.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'IR fuzz iterations per JVM and lane'
        required: false
        default: '40000'
      compositions:
        description: 'Coverage compositions, each a projection and a filter'
        required: false
        default: '400'
      seed:
        description: 'Base seed; the date when empty'
        required: false
        default: ''

jobs:
  fuzz:
    name: Nightly fuzz
    # Never on apache/spark, whose tree has no Varka; on this project's repositories always.
    if: github.repository != 'apache/spark'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache SBT and Maven
      uses: actions/cache@v4
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
        restore-keys: |
          build-
    - name: Cache Coursier local repository
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: varka-fuzz-coursier-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
        restore-keys: |
          varka-fuzz-coursier-
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Install the Varka engine
      uses: ./.github/actions/install-varka-engine
    # The runner's CPU and the vector width HotSpot uses, recorded before any kernel runs: GitHub's
    # pool mixes AVX2 and AVX-512 machines, and a wrong answer from C2's code that one runner
    # showed and the laptop and a second runner did not (VARKA-396) could not be placed without
    # them. Written to the step summary and beside the logs the job keeps.
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/fuzz
    - name: Compile the catalyst tests and export their classpath
      run: |
        # The shell opens the redirect's file before sbt runs, and a fresh checkout has no
        # target/ yet.
        mkdir -p target
        # Under CI, sbt colours its output and ends it with an ANSI clear-line sequence on a
        # line of its own, after the classpath, so the classpath is taken as the one line that
        # is a path list once the escape sequences are stripped, and checked for the test runner
        # rather than for being non-empty.
        ./build/sbt -Phive -batch "catalyst/Test/compile" "export catalyst/Test/fullClasspath" \
          | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -E '^/[^ ]+$' | tail -1 \
          > target/catalyst-test-classpath.txt
        grep -q scalatest target/catalyst-test-classpath.txt
    # One JVM per core, each with its own seed and log, waited on by process id, which exits
    # on every path (sql/varka/skills/testing-and-debugging.md, "A fuzz campaign is sixteen
    # JVMs, not one sbt"). Every tenth passing draw is also run in each of its variants
    # (VARKA-278), which costs about four draws' worth each, so the variants add about half to
    # the step. Each JVM already runs this one suite alone, so the suite runs in it directly
    # (-Dvarka.ownJvm=true) rather than forking the child VarkaOwnJvm would start: that child's
    # budget is a per-test cap less a minute for the whole suite, nine minutes, which the
    # suite's sixteen tests outgrew at this volume on 13 October and every night after
    # (VARKA-392). The per-test caps are raised to the job's scale, as the variants step does:
    # the compiled test of VARKA-274 alone took 13 minutes with four JVMs on four cores.
    - name: Run the IR fuzzer, one JVM per core
      env:
        ITERATIONS: ${{ inputs.iterations || '40000' }}
        SEED: ${{ inputs.seed }}
      run: |
        set -uo pipefail
        CP="$(cat target/catalyst-test-classpath.txt)"
        base="${SEED:-$(date -u +%Y%m%d)}"
        cores="$(nproc)"
        mkdir -p target/fuzz
        pids=()
        for k in $(seq 0 $((cores - 1))); do
          seed="${base}${k}"
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED \
            -Dspark.testing=1 -Dspark.test.home="$GITHUB_WORKSPACE" -Dvarka.ownJvm=true \
            -Dspark.test.timeout=45 -Dvarka.test.watchdog.minutes=45 \
            -Dvarka.fuzz.iterations="$ITERATIONS" -Dvarka.fuzz.seed="$seed" \
            -Dvarka.fuzz.variantsEvery=10 \
            -cp "$CP" org.scalatest.tools.Runner -oW \
            -s org.apache.spark.sql.catalyst.expressions.codegen.varka.VarkaIrFuzzSuite \
            > "target/fuzz/ir-$seed.log" 2>&1 &
          pids+=($!)
          echo "seed $seed: pid ${pids[-1]}"
        done
        failed=0
        for i in "${!pids[@]}"; do
          if wait "${pids[$i]}"; then
            echo "JVM $i: passed"
          else
            echo "JVM $i: FAILED"; failed=1
          fi
        done
        {
          echo "## IR fuzzer: $cores JVMs, $ITERATIONS iterations per lane, seeds ${base}0..${base}$((cores - 1))"
          grep -h -E "Tests: succeeded|FAILED|varka.fuzz.seed=" target/fuzz/ir-*.log | sort | uniq -c
        } | tee -a "$GITHUB_STEP_SUMMARY"
        exit $failed
    # Each fuzzer below runs whether or not the one before it failed: a failed step otherwise
    # skips the rest, and one fuzzer's failure hid the other two for six nights (VARKA-392).
    - name: Run the coverage composition fuzzer
      if: ${{ !cancelled() }}
      env:
        COMPOSITIONS: ${{ inputs.compositions || '400' }}
        SEED: ${{ inputs.seed }}
      run: |
        set -uo pipefail
        CP="$(cat target/catalyst-test-classpath.txt)"
        seed="${SEED:-$(date -u +%Y%m%d)}"
        # sbt sets spark.test.home for its tests; a plain JVM needs it passed, or every test
        # that reads a workspace file - the coverage table here - fails before it starts. The
        # suite runs in this JVM, alone, as the IR fuzzer runs in each of its JVMs.
        java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED \
          -Dspark.testing=1 -Dspark.test.home="$GITHUB_WORKSPACE" -Dvarka.ownJvm=true \
          -Dvarka.fuzz.compositions="$COMPOSITIONS" -Dvarka.fuzz.seed="$seed" \
          -cp "$CP" org.scalatest.tools.Runner -oW \
          -s org.apache.spark.sql.catalyst.expressions.codegen.varka.VarkaCoverageCompositionFuzzSuite \
          2>&1 | tee target/fuzz/compositions-$seed.log
        status=${PIPESTATUS[0]}
        {
          echo "## Coverage compositions: $COMPOSITIONS, seed $seed"
          grep -E "Tests: succeeded|FAILED" "target/fuzz/compositions-$seed.log" || true
        } | tee -a "$GITHUB_STEP_SUMMARY"
        exit "$status"
    # Every small tree to size 4 in each of the eight variants of VARKA-278, one JVM per core,
    # each taking every n-th tree. Size 3 runs in pull requests; size 4 is a few minutes here.
    - name: Run every tree's variants to size 4, one JVM per core
      if: ${{ !cancelled() }}
      run: |
        set -uo pipefail
        CP="$(cat target/catalyst-test-classpath.txt)"
        cores="$(nproc)"
        mkdir -p target/fuzz/variants
        pids=()
        for k in $(seq 0 $((cores - 1))); do
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED \
            -Dspark.testing=1 -Dspark.test.home="$GITHUB_WORKSPACE" -Dvarka.ownJvm=true \
            -Dspark.test.timeout=60 -Dvarka.test.watchdog.minutes=60 \
            -Dvarka.variants.size=4 -Dvarka.series.slice="$k/$cores" \
            -cp "$CP" org.scalatest.tools.Runner -oW \
            -s org.apache.spark.sql.catalyst.expressions.codegen.varka.VarkaVariantSuite \
            -z "in each variant" \
            > "target/fuzz/variants/slice-$k.log" 2>&1 &
          pids+=($!)
        done
        failed=0
        for k in "${!pids[@]}"; do
          if wait "${pids[$k]}"; then
            echo "slice $k: passed"
          else
            echo "slice $k: FAILED"; failed=1
          fi
        done
        {
          echo "## Every small tree to size 4 in each variant: $cores JVMs"
          grep -h -E "Tests: succeeded|FAILED" target/fuzz/variants/slice-*.log | sort | uniq -c
        } | tee -a "$GITHUB_STEP_SUMMARY"
        exit $failed
    - name: Keep the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-fuzz-logs
        path: target/fuzz/
        retention-days: 30

  series:
    name: Every small tree, size 5
    # VARKA-269: every IR tree of five grammar productions through the emitter against the
    # reference evaluator, 3.16 million int trees and the long lane's, then size 4 at the narrow
    # width; the pull request's gate runs sizes to 3. A job of its own, so its time is not the
    # fuzzer's. The size-4 step takes minutes, hence 165 against size 5's 140-minute caps.
    if: github.repository != 'apache/spark'
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache SBT and Maven
      uses: actions/cache@v4
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
        restore-keys: |
          build-
    - name: Cache Coursier local repository
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: varka-fuzz-coursier-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
        restore-keys: |
          varka-fuzz-coursier-
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Install the Varka engine
      uses: ./.github/actions/install-varka-engine
    # The runner's CPU and the vector width HotSpot uses, recorded before any kernel runs: GitHub's
    # pool mixes AVX2 and AVX-512 machines, and a wrong answer from C2's code that one runner
    # showed and the laptop and a second runner did not (VARKA-396) could not be placed without
    # them. Written to the step summary and beside the logs the job keeps.
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/series
    - name: Compile the catalyst tests and export their classpath
      run: |
        mkdir -p target
        # The classpath is the one line that is a path list once sbt's escape sequences are
        # stripped, as the fuzz job reads it.
        ./build/sbt -Phive -batch "catalyst/Test/compile" "export catalyst/Test/fullClasspath" \
          | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -E '^/[^ ]+$' | tail -1 \
          > target/catalyst-test-classpath.txt
        grep -q scalatest target/catalyst-test-classpath.txt
    # One JVM per core, each taking every n-th tree (-Dvarka.series.slice), waited on by process
    # id. JVMs and not threads: the emitter is not shown safe to call from several (row 307). The
    # suite runs in the runner JVM, and its caps, in minutes, are raised past a slice's run.
    - name: Run every tree to size 5, one JVM per core
      run: |
        set -uo pipefail
        CP="$(cat target/catalyst-test-classpath.txt)"
        cores="$(nproc)"
        mkdir -p target/series
        pids=()
        for k in $(seq 0 $((cores - 1))); do
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED \
            -Dspark.testing=1 -Dspark.test.home="$GITHUB_WORKSPACE" -Dvarka.ownJvm=true \
            -Dspark.test.timeout=140 -Dvarka.test.watchdog.minutes=140 \
            -Dvarka.series.size=5 -Dvarka.series.slice="$k/$cores" \
            -cp "$CP" org.scalatest.tools.Runner -oW \
            -s org.apache.spark.sql.catalyst.expressions.codegen.varka.VarkaSmallTreeSuite \
            -z "matches the reference evaluator" \
            > "target/series/slice-$k.log" 2>&1 &
          pids+=($!)
        done
        failed=0
        for k in "${!pids[@]}"; do
          if wait "${pids[$k]}"; then
            echo "slice $k: passed"
          else
            echo "slice $k: FAILED"; failed=1
          fi
        done
        {
          echo "## Every small tree to size 5: $cores JVMs"
          grep -h -E "Tests: succeeded|FAILED" target/series/slice-*.log | sort | uniq -c
        } | tee -a "$GITHUB_STEP_SUMMARY"
        exit $failed
    # Size 4 at the narrow width: pull requests ran it at both widths until VARKA-269 9 moved it
    # here, and size 5 above runs at the runner's own width only.
    - name: Run every tree to size 4 at the 128-bit width, one JVM per core
      if: always()
      run: |
        set -uo pipefail
        CP="$(cat target/catalyst-test-classpath.txt)"
        cores="$(nproc)"
        mkdir -p target/series-narrow
        pids=()
        for k in $(seq 0 $((cores - 1))); do
          java --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED \
            -Dspark.testing=1 -Dspark.test.home="$GITHUB_WORKSPACE" -Dvarka.ownJvm=true \
            -Dspark.test.timeout=140 -Dvarka.test.watchdog.minutes=140 \
            -XX:MaxVectorSize=16 -Dvarka.series.size=4 -Dvarka.series.slice="$k/$cores" \
            -cp "$CP" org.scalatest.tools.Runner -oW \
            -s org.apache.spark.sql.catalyst.expressions.codegen.varka.VarkaSmallTreeSuite \
            -z "matches the reference evaluator" \
            > "target/series-narrow/slice-$k.log" 2>&1 &
          pids+=($!)
        done
        failed=0
        for k in "${!pids[@]}"; do
          if wait "${pids[$k]}"; then
            echo "slice $k: passed"
          else
            echo "slice $k: FAILED"; failed=1
          fi
        done
        {
          echo "## Every small tree to size 4 at 128 bits: $cores JVMs"
          grep -h -E "Tests: succeeded|FAILED" target/series-narrow/slice-*.log | sort | uniq -c
        } | tee -a "$GITHUB_STEP_SUMMARY"
        exit $failed
    - name: Keep the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-series-logs
        path: |
          target/series/
          target/series-narrow/
        retention-days: 30

  report-failure:
    name: Report a failed run
    # Only a scheduled run, since a person who dispatches one sees its result; only on the
    # project's own repository, where issues are on; and for a failed or cancelled job, a
    # job past its timeout-minutes ending as cancelled.
    needs: [fuzz, series]
    if: >-
      always() && github.event_name == 'schedule' && github.repository == 'vecbricks/varka'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          dev
    - name: Report the failure
      uses: ./.github/actions/report-scheduled-failure
