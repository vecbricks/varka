# The push signal for the check sync (VARKA-255.md 3.2). Each push to a pull request runs this
# job, and its completion starts update_build_status.yml on `workflow_run`, which creates and
# syncs the pull request's Build check from the default branch with this repository's write
# token. This job runs on `pull_request`, so for a pull request from a fork it gets a read-only
# token and no secrets; it checks nothing out and writes nothing. update_build_status.yml names
# this workflow by its `name` below, and a pull request runs its own copy of this file but the
# default branch's updater, so a rename lands in the updater's `workflows:` list first.
name: On pull request update
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

# A newer push cancels the wait for an older head; a cancelled run still completes, and its
# completion starts the updater like any other.
concurrency:
  group: pr-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait:
    name: Wait for the fork's Build run
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # The fork's build_main.yml run starts on the same push but may take a while to register,
      # and the sync's first pass writes an action_required check when it finds no run for the
      # head commit. Waiting here, up to three minutes, for that run to be listed lets the first
      # pass find it. The read is of a public repository; a failed read is retried until the
      # deadline, and whatever the job finds, it succeeds, because only its completion matters.
      - name: Wait for the fork's Build run
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            if (!pr.head.repo) {
              console.log('The head repository is gone; nothing to wait for')
              return
            }
            const params = {
              owner: pr.head.repo.owner.login,
              repo: pr.head.repo.name,
              id: 'build_main.yml',
              branch: pr.head.ref
            }
            const deadline = Date.now() + 180 * 1000
            for (;;) {
              try {
                const runs = await github.request(
                  'GET /repos/{owner}/{repo}/actions/workflows/{id}/runs', params)
                const run = runs.data.workflow_runs.find(r => r.head_sha == pr.head.sha)
                if (run) {
                  console.log('Fork run ' + run.html_url + ' is ' + run.status)
                  return
                }
              } catch (error) {
                console.log('Listing the fork runs failed: ' + error.message)
              }
              if (Date.now() + 10 * 1000 > deadline) {
                console.log('No fork run for ' + pr.head.sha + ' after three minutes')
                return
              }
              await new Promise(resolve => setTimeout(resolve, 10 * 1000))
            }
