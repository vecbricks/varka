# The task table, mirrored as issues (task 183): whenever a milestone plan changes on
# master, dev/varka_issues.py opens an issue for each row that is open, brings an existing
# one to its row, and closes the issues of rows that turned done or withdrawn, quoting the
# outcome. The table is the source of truth; this keeps the view GitHub shows in step.
name: Varka issues

on:
  push:
    branches:
      - master
    paths:
      - 'sql/varka/plans/PLAN_MILESTONE_*.md'
      - 'dev/varka_issues.py'
      - 'dev/varka_good_first_tasks.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Mirror the task table
    if: github.repository == 'vecbricks/varka'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Open, update and close the issues
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./dev/varka_issues.py --apply --repo "${{ github.repository }}"
