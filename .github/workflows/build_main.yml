name: "Build"

on:
  push:
    branches:
    - '**'

jobs:
  call-build-and-test:
    permissions:
      packages: write
      # The admit job reads the fork's Build runs and their jobs (VARKA-255.md 3.1).
      actions: read
    name: Run
    # Skip pushes to `master` on forks: the "Sync fork" button mirrors
    # apache/spark and would otherwise re-run the full build on every sync.
    # Post-merge sampling on apache/spark master and branch-4.x is applied by
    # dev/merge_spark_pr.py through GitHub's workflow-skip commit trailer.
    if: github.repository == 'apache/spark' || github.ref != 'refs/heads/master'
    uses: ./.github/workflows/build_and_test.yml
    with:
      # The root pom sets java.version=25, which drives both maven.compiler.release
      # and the enforcer's requireJavaVersion rule, so Spark no longer builds on the
      # workflow's default JDK of 21. The Varka engine targets release 25 as well.
      java: 25
      # A job of the module matrix is cut at 100 minutes by default. On a fork, the sql shards
      # and the catalyst shard, which runs Varka's width audit, took 90 to 110 minutes on a
      # shared runner and two of them were cut (vecbricks/varka#1773), so the limit is 180.
      build_timeout_minutes: 180
      # Sampled upstream pushes run the full job matrix except SparkR, which the scheduled
      # builds cover. Fork pushes keep the reusable workflow's change-based selection.
      jobs: >-
        ${{ github.repository == 'apache/spark' && '{
          "build": "true",
          "build-core-utils": "true",
          "pyspark": "true",
          "pyspark-pandas": "true",
          "pyspark-periodic": "true",
          "pyspark-connect-old-client": "true",
          "sparkr": "false",
          "tpcds-1g": "true",
          "docker-integration-tests": "true",
          "lint": "true",
          "java25": "true",
          "docs": "true",
          "yarn": "true",
          "k8s-integration-tests": "true",
          "oidc-e2e": "true",
          "buf": "true",
          "ui": "true",
          "rust-sdk": "true",
          "transpile": "true"
        }' || '' }}
