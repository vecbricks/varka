# The option configuration matrix, every configuration (VARKA-248.md 3.2.8). The Varka suites
# rerun once per configuration - the emit defaults with one option changed, carried by every kernel
# they emit - fanned out (VARKA-507): one job builds the test classes, or takes them from the
# pull request's Build of the same commit, and plans the bins, about a hundred jobs of eight
# minutes' work each run one bin of (configuration, module, suites) runner JVMs, at most 30 at a
# time, and one job merges their runs and reports, the declining check comparing every
# configuration's fused batches with the defaults' (dev/varka_matrix_bins.py). A bin that frees a
# slot hands it to the next, so a slow runner holds back only its own bin. A pull request runs one
# configuration in its varka-scoped jobs; this runs all of them once a week and on dispatch. See
# dev/varka_matrix.sh.
name: Varka option matrix

on:
  schedule:
    # Sunday 03:00 UTC, after the weekly full Spark matrix has started and before Monday's
    # pull requests.
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build:
    name: "Option matrix: build and plan"
    # Never on apache/spark, whose tree has no Varka. The Sunday schedule runs on vecbricks/varka
    # only: the fork's master follows this project's (varka-fork-sync.yml) and carries this file,
    # and a schedule there does nothing. A dispatch runs on either repository. The jobs after
    # this one need it, so they are skipped with it.
    if: >-
      github.repository != 'apache/spark'
      && (github.event_name != 'schedule' || github.repository == 'vecbricks/varka')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      bins: ${{ steps.plan.outputs.bins }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache SBT and Maven
      uses: actions/cache@v4
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
        restore-keys: |
          build-
    - name: Cache Coursier local repository
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: varka-option-matrix-coursier-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
        restore-keys: |
          varka-option-matrix-coursier-
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Install the Varka engine
      uses: ./.github/actions/install-varka-engine
    # A push of Varka files alone runs the Build's varka-scoped jobs, the first sql one of which
    # archives the test classes of its commit: this takes that archive, waiting for it while the
    # Build may still upload it, and compiles them itself only when no Build of the commit will
    # (dev/varka_matrix_reuse.py). Any failure of the lookup or the download leaves the compile.
    - name: Find the Build's test classes
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./dev/varka_matrix_reuse.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_OUTPUT" ||
          echo "run=" >> "$GITHUB_OUTPUT"
    - name: Download the Build's test classes
      if: steps.reuse.outputs.run != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: varka-option-matrix-build
        path: target/varka-reuse
        run-id: ${{ steps.reuse.outputs.run }}
        github-token: ${{ github.token }}
    # The same Build's record of which configurations move each test (VarkaTestReach), taken
    # only when every one of its varka-scoped jobs succeeded and left its part: a configuration
    # then runs only the tests it moves, and without the record it runs every test.
    - name: Find the Build's reach
      id: reach
      if: steps.reuse.outputs.run != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./dev/varka_matrix_reuse.py reach "$GITHUB_REPOSITORY" "${{ steps.reuse.outputs.run }}" \
          >> "$GITHUB_OUTPUT" || echo "reach=" >> "$GITHUB_OUTPUT"
    - name: Download the Build's reach
      if: steps.reach.outputs.reach == '1'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: varka-matrix-reach-*
        path: target/varka-reach
        run-id: ${{ steps.reuse.outputs.run }}
        github-token: ${{ github.token }}
    # The same Build's expression harness plans and Spark's answers (VarkaHarnessStore), every
    # sql job's files in one directory: a configuration's harness takes them instead of planning
    # and computing them again. Whatever is missing - no file, a job that wrote none, a file of
    # another commit, which the harness ignores - it plans and computes itself, as without them.
    - name: Download the Build's harness store
      if: steps.reuse.outputs.run != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: varka-harness-store-*
        path: target/varka-harness-store
        merge-multiple: true
        run-id: ${{ steps.reuse.outputs.run }}
        github-token: ${{ github.token }}
    - name: Build the test classes
      run: |
        reused=0
        if [ -s target/varka-reuse/varka-matrix-build.tar ]; then
          echo "== the test classes of Build run ${{ steps.reuse.outputs.run }}"
          if ./dev/varka_matrix_archive.sh unpack target/varka-reuse/varka-matrix-build.tar \
              target/varka-matrix &&
            ./dev/varka_matrix.sh --skip-build --build-dir target/varka-matrix --build-only \
              --out target/varka-matrix; then
            reused=1
          else
            echo "== the Build's test classes did not unpack or list the configurations"
          fi
          rm -f target/varka-reuse/varka-matrix-build.tar
        fi
        if [ "$reused" = 0 ]; then
          ./dev/varka_matrix.sh --build-only --sbt-arg -Phive --out target/varka-matrix
        elif ls target/varka-reach/*/varka-reach.tsv > /dev/null 2>&1; then
          # The record holds for the commit it was made on, which is this one.
          cat target/varka-reach/*/varka-reach.tsv > target/varka-matrix/reach.tsv
          echo "== the reach of Build run ${{ steps.reuse.outputs.run }}:" \
            "$(grep -vc '^#' target/varka-matrix/reach.tsv) tests"
        fi
        # The harness store rides in the classpath's archive to the bins, as the reach does, and
        # only with the Build's classes, which it was written by.
        if [ "$reused" = 1 ] && compgen -G "target/varka-harness-store/harness-*.bin" > /dev/null
        then
          mkdir -p target/varka-matrix/harness-store
          cp target/varka-harness-store/harness-*.bin target/varka-matrix/harness-store/
          files=(target/varka-matrix/harness-store/harness-*.bin)
          echo "== the harness store of Build run ${{ steps.reuse.outputs.run }}:" \
            "${#files[@]} files," \
            "$(du -sh target/varka-matrix/harness-store | cut -f1)"
        fi
    # The bins, from the configurations the build listed and each module's suites; one line of
    # the summary says how many and how long.
    - name: Plan the bins
      id: plan
      run: |
        set -o pipefail
        mkdir -p target/varka-bins
        for module in sql catalyst; do
          ./dev/varka_matrix.sh --list-suites --module "$module" > "target/varka-bins/$module"
        done
        reach=()
        [ -s target/varka-matrix/reach.tsv ] && reach=(--reach target/varka-matrix/reach.tsv)
        python3 dev/varka_matrix_bins.py plan \
          --configurations target/varka-matrix/configurations \
          --suites sql=target/varka-bins/sql --suites catalyst=target/varka-bins/catalyst \
          "${reach[@]}" > target/varka-bins/bins.json 2> target/varka-bins/plan.txt
        cat target/varka-bins/plan.txt | tee -a "$GITHUB_STEP_SUMMARY"
        echo "bins=$(cat target/varka-bins/bins.json)" >> "$GITHUB_OUTPUT"
    # Every entry of the test classpath, the build's class directories and the dependencies' jars
    # alike, archived at its absolute path, which is the same on every runner, with the classpath
    # and JVM options the bins read.
    - name: Archive the classpath
      run: ./dev/varka_matrix_archive.sh pack target/varka-matrix target/varka-build.tar
    - name: Upload the classpath
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-build
        path: target/varka-build.tar
        retention-days: 1
        compression-level: 1
    # The record the configurations ran by, for the report job's suite weights: a suite's weight
    # is its time run whole, and a configuration that ran only the tests the record let through
    # ran part of it (dev/varka_matrix_bins.py times --reach, VARKA-508).
    - name: Upload the reach the configurations ran by
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-reach
        path: target/varka-matrix/reach.tsv
        if-no-files-found: ignore
        retention-days: 30

  bins:
    name: "Option matrix: ${{ matrix.bin }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix: ${{ fromJSON(needs.build.outputs.bins) }}
    steps:
    # The run's wall time is its slowest bin's, so a setup step that stalls holds back the whole
    # run: in run 40855387471 one bin spent 16.3 minutes installing Java, where the median bin took
    # 8 seconds (VARKA-513). Each setup step of a bin has a timeout a few times its usual length
    # and, when it times out or fails, one retry, which leaves a line the report job prints.
    - name: Checkout
      id: checkout
      uses: actions/checkout@v6
      timeout-minutes: 3
      continue-on-error: true
    - name: Checkout, again
      if: steps.checkout.outcome != 'success'
      uses: actions/checkout@v6
      timeout-minutes: 5
    - name: Install Java 25
      id: java
      uses: actions/setup-java@v5
      timeout-minutes: 3
      continue-on-error: true
      with:
        distribution: zulu
        java-version: '25'
    - name: Install Java 25, again
      if: steps.java.outcome != 'success'
      uses: actions/setup-java@v5
      timeout-minutes: 5
      with:
        distribution: zulu
        java-version: '25'
    # The runner's CPU and the vector width HotSpot uses, before any kernel runs: the pool mixes
    # 256-bit and 512-bit machines, and a bin that fails on one and passes on the other has to be
    # read against the machine it ran on (VARKA-399).
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/varka-units/${{ matrix.bin }}/${{ matrix.bin }}-platform
    - name: Download the classpath
      id: classpath
      uses: actions/download-artifact@v4
      timeout-minutes: 8
      continue-on-error: true
      with:
        name: varka-option-matrix-build
        path: target
    - name: Download the classpath, again
      if: steps.classpath.outcome != 'success'
      uses: actions/download-artifact@v4
      timeout-minutes: 10
      with:
        name: varka-option-matrix-build
        path: target
    - name: Record the setup steps retried
      if: >-
        steps.checkout.outcome != 'success' || steps.java.outcome != 'success'
        || steps.classpath.outcome != 'success'
      env:
        BIN: ${{ matrix.bin }}
        CHECKOUT: ${{ steps.checkout.outcome }}
        JAVA: ${{ steps.java.outcome }}
        CLASSPATH: ${{ steps.classpath.outcome }}
      run: |
        dir=target/varka-units/$BIN/$BIN-setup
        mkdir -p "$dir"
        for step in "checkout:$CHECKOUT" "java:$JAVA" "classpath:$CLASSPATH"; do
          if [ "${step#*:}" != success ]; then
            echo "$BIN ${step%%:*} ${step#*:}, retried" | tee -a "$dir/retries.txt"
          fi
        done
        echo "::warning title=Setup step retried::$(paste -sd ';' "$dir/retries.txt")"
    - name: Unpack the classpath
      run: |
        ./dev/varka_matrix_archive.sh unpack target/varka-build.tar target/varka-matrix
        rm target/varka-build.tar
    # Each unit is one runner JVM, two at a time on the runner's four cores and 16 GB, each in a
    # directory of its own named by the bin, so that the report job can merge every bin's runs.
    # The small-tree series at size 4, which pull requests no longer run (VARKA-269 9): every
    # configuration meets every tree to size 4, IfElse included.
    - name: Run this bin's units
      env:
        UNITS: ${{ matrix.units }}
        BIN: ${{ matrix.bin }}
      run: |
        out=target/varka-units/$BIN
        mkdir -p "$out"
        # The step's shell is bash -e: a unit's status is captured, so that a failing unit
        # neither ends the step before the others run nor goes unrecorded.
        run_unit() {
          local k=$1 config=$2 module=$3 suites=$4 mode status=0
          if [ "$config" = defaults ]; then mode=(--defaults); else mode=(--config "$config"); fi
          # A configuration runs only the tests the Build's record says it moves.
          if [ "$config" != defaults ] && [ -s target/varka-matrix/reach.tsv ]; then
            mode+=(--jvm-arg "-Dvarka.matrix.reachFile=$PWD/target/varka-matrix/reach.tsv")
          fi
          # A configuration's harness takes the plans and answers the Build's defaults wrote.
          if [ "$config" != defaults ] && \
              compgen -G "target/varka-matrix/harness-store/harness-*.bin" > /dev/null; then
            mode+=(--jvm-arg "-Dvarka.harness.store=$PWD/target/varka-matrix/harness-store")
          fi
          ./dev/varka_matrix.sh --skip-build --build-dir target/varka-matrix --runs-only \
            --out "$out/$BIN-u$k" --leaf-suffix "$BIN-$k" --module "$module" --suites "$suites" \
            "${mode[@]}" --jvm-arg -Dvarka.series.size=4 > "$out/$BIN-u$k.log" 2>&1 || status=$?
          echo "$status" > "$out/$BIN-u$k.exit"
        }
        k=0 running=0
        while IFS='|' read -r config module suites; do
          [ -n "$config" ] || continue
          run_unit "$k" "$config" "$module" "$suites" &
          k=$((k + 1)) running=$((running + 1))
          if [ "$running" -ge 2 ]; then wait -n || true; running=$((running - 1)); fi
        done <<< "$UNITS"
        wait || true
        status=0
        for f in "$out"/*-u*.exit; do
          if [ "$(cat "$f")" != 0 ]; then
            echo "== ${f%.exit}.log:"; tail -40 "${f%.exit}.log"; status=1
          fi
        done
        exit "$status"
    - name: Upload the bin's runs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-${{ matrix.bin }}
        path: |
          target/varka-units/${{ matrix.bin }}/*-platform/platform.txt
          target/varka-units/${{ matrix.bin }}/*-setup/retries.txt
          target/varka-units/${{ matrix.bin }}/*-u*.log
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/name
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/exit
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/seconds
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/run.log
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/fused.tsv
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/junit/*.xml
        if-no-files-found: ignore
        retention-days: 30

  report:
    name: "Option matrix: report"
    needs: [build, bins]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Download every bin's runs
      uses: actions/download-artifact@v4
      with:
        pattern: varka-option-matrix-b[0-9]*
        path: target/varka-bins
        merge-multiple: true
    # Every unit's runs/ into one: a configuration's directory gathers the JVM directories of all
    # its units, which their bin names keep apart; the report then reads one run of the matrix.
    - name: Merge the runs
      run: |
        mkdir -p target/varka-merged/runs
        for runs in target/varka-bins/*-u*/runs; do
          cp -r "$runs"/. target/varka-merged/runs/
        done
        echo "sql catalyst" > target/varka-merged/runs/modules
    - name: Report
      run: |
        set -o pipefail
        ./dev/varka_matrix.sh --report-only target/varka-merged | tee target/varka-matrix-report.txt
    - name: Summary
      if: always()
      run: |
        {
          echo "## Option matrix"
          echo '```'
          sed -n '/^configuration/,$p' target/varka-matrix-report.txt 2>/dev/null || echo "no report"
          echo '```'
          # The machines the bins ran on, so that an unfused line can be read against them.
          echo "Bins by CPU:"
          echo '```'
          grep -h '^CPU' target/varka-bins/*-platform/platform.txt | sort | uniq -c || true
          echo '```'
          # The bins a setup step held back, each retried once (VARKA-513).
          echo "Setup steps retried:"
          echo '```'
          cat target/varka-bins/*-setup/retries.txt 2>/dev/null || echo "none"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Download the reach the configurations ran by
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: varka-option-matrix-reach
        path: target/varka-run-reach
    # Each suite's seconds run whole, its median over the configurations that ran all of it, and
    # its seconds under each of them, from this run's JUnit reports, for the next plan's weights
    # (sql/varka/matrix/suite-seconds.tsv and config-suite-seconds.tsv).
    - name: Suite seconds
      if: always()
      run: |
        python3 dev/varka_matrix_bins.py times --reach target/varka-run-reach/reach.tsv \
          --per-configuration target/config-suite-seconds.tsv \
          target/varka-merged/runs > target/suite-seconds.tsv
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-report
        path: |
          target/varka-matrix-report.txt
          target/suite-seconds.tsv
          target/config-suite-seconds.tsv
        if-no-files-found: ignore
        retention-days: 30

  report-failure:
    name: Report a failed run
    # Only a scheduled run, since a person who dispatches one sees its result; only on the
    # project's own repository, where issues are on; and when a job failed or was cancelled.
    # The script lists every failed, timed-out or cancelled job, a cancelled one with a note.
    needs: [build, bins, report]
    if: >-
      always() && github.event_name == 'schedule' && github.repository == 'vecbricks/varka'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          dev
    - name: Report the failure
      uses: ./.github/actions/report-scheduled-failure
      with:
        needs: ${{ toJSON(needs) }}
