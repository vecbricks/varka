# The option configuration matrix, every configuration (VARKA-248.md 3.2.8). The Varka suites
# rerun once per configuration - the emit defaults with one option changed, carried by every kernel
# they emit - fanned out (VARKA-507): one job builds the test classes, or takes them from the
# pull request's Build of the same commit, and plans the bins, about a hundred jobs of eight
# minutes' work each run one bin of (configuration, module, suites) runner JVMs, at most `slots`
# at a time in each stage (38 on the fork, 16 on vecbricks/varka), and one job merges their runs
# and reports, the declining check comparing every
# configuration's fused batches with the defaults' (dev/varka_matrix_bins.py). A bin that frees a
# slot hands it to the next, so a slow runner holds back only its own bin. A pull request runs one
# configuration in its varka-scoped jobs; this runs all of them on dispatch. See
# dev/varka_matrix.sh. The bins run in two stages (VARKA-637 3.1): the suites the branch changed,
# under every configuration, then every other unit, so a red first stage ends the run early and a
# green run runs every unit a single stage would.
#
# On vecbricks/varka a dispatch must name a pull request, `pr` and `sha`, and tests that head, so
# its runners can take a pull request's matrix beside the fork's (MaxGekk/spark), whose dispatches
# test the dispatched branch. It runs at most 16 bins at a time there by default and compiles the
# test classes itself, since the fork's Build artifacts need a token it lacks. Runs there do not
# queue against each other: ~/varka-ops' dispatcher starts one at a time. There is no weekly run
# until row 522 (m9/VARKA-522.md 2.1) moves the schedule to the fork.
name: Varka option matrix
run-name: >-
  ${{ inputs.pr != '' && format('Varka option matrix of #{0} at {1}', inputs.pr, inputs.sha)
  || 'Varka option matrix' }}

on:
  schedule:
    # Sunday 03:00 UTC, after the weekly full Spark matrix has started and before Monday's
    # pull requests. The build job admits it nowhere until row 522 turns it to the fork.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      stages:
        description: "two: the changed suites first, then the rest; one: all at once"
        type: choice
        options: [two, one]
        default: two
      pr:
        description: 'On vecbricks/varka only, and required there: a pull request number of vecbricks/varka, whose head, the sha input, the run tests instead of the dispatched ref.'
        required: false
        default: ''
      sha:
        description: 'With pr: the head commit of the pull request, all 40 hex digits. The build job fails when refs/pull/<pr>/head is another commit.'
        required: false
        default: ''
      slots:
        description: 'At most this many bins at once. Blank for 16 on vecbricks/varka, which leaves its benchmarks two of its 20 runners, and 38 elsewhere.'
        required: false
        default: ''
      plant-straggler:
        description: 'A bin (bNNN) whose units step sleeps past its deadline, to test the stop'
        required: false
        default: ''

# Read-only: with `pr` the jobs build and run a pull request's code. `actions: read` lets the
# build job read the Build runs and artifacts it reuses. report-failure keeps a wider block.
permissions:
  contents: read
  actions: read

env:
  # The repository whose pull requests `pr` names, also on the fork, whose own pull requests are
  # apache/spark's.
  VARKA_BASE_REPO: vecbricks/varka

jobs:
  build:
    name: "Option matrix: build and plan"
    # Never on apache/spark, whose tree has no Varka, and never on the schedule: vecbricks/varka
    # has 20 runners and no Build to reuse, and the fork's turn waits for row 522. The jobs after
    # this one need it, so they are skipped with it.
    if: github.repository != 'apache/spark' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      first: ${{ steps.plan.outputs.first }}
      rest: ${{ steps.plan.outputs.rest }}
    steps:
    # vecbricks/varka, with 20 runners and no Build to reuse, tests only a pull request's head,
    # which the run's name gives, so the head must still be that commit. The fork tests the
    # dispatched branch: there the commit is the run's own, which the CI tools read
    # (dev/varka_ci_ledger.py), so `pr` is refused.
    - name: Check the inputs
      env:
        PR: ${{ inputs.pr }}
        SHA: ${{ inputs.sha }}
        SLOTS: ${{ inputs.slots }}
      run: |
        if [ -n "$SLOTS" ] && ! [[ "$SLOTS" =~ ^[1-9][0-9]?$ && "$SLOTS" -le 38 ]]; then
          echo "::error::slots must be a number from 1 to 38, not '$SLOTS'"; exit 1
        fi
        if [ "$GITHUB_REPOSITORY" != "$VARKA_BASE_REPO" ]; then
          if [ -n "$PR$SHA" ]; then
            echo "::error::pr and sha are for $VARKA_BASE_REPO; dispatch the branch here"; exit 1
          fi
          exit 0
        fi
        if ! [[ "$PR" =~ ^[1-9][0-9]*$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::pr must be a number and sha 40 hex digits, not '$PR' and '$SHA'"; exit 1
        fi
        head=$(git ls-remote "https://github.com/$VARKA_BASE_REPO.git" "refs/pull/$PR/head" |
          cut -f1)
        if [ "$head" != "$SHA" ]; then
          echo "::error::refs/pull/$PR/head of $VARKA_BASE_REPO is ${head:-missing}, not $SHA"
          exit 1
        fi
    - name: Checkout
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.pr != '' && env.VARKA_BASE_REPO || github.repository }}
        ref: ${{ inputs.pr != '' && inputs.sha || '' }}
        persist-credentials: false
    # A pull request's code writes these directories, and its run saves them in the dispatched
    # ref's scope, master's, so its keys start with `pr-`, which no other run's restore-keys
    # match, and the engine's own cache is not saved.
    - name: Cache SBT and Maven
      uses: actions/cache@v4
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: ${{ inputs.pr != '' && 'pr-' || '' }}build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
        restore-keys: |
          build-
    - name: Cache Coursier local repository
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: >-
          ${{ inputs.pr != '' && 'pr-' || '' }}varka-option-matrix-coursier-${{
          hashFiles('**/pom.xml', '**/plugins.sbt') }}
        restore-keys: |
          varka-option-matrix-coursier-
    - name: Install Java 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'
    - name: Install the Varka engine
      uses: ./.github/actions/install-varka-engine
      with:
        cache: ${{ inputs.pr == '' }}
    # A push that builds catalyst or sql runs the Build's varka-scoped jobs, beside Spark's
    # matrix when it changes files outside Varka's, and their classes job archives the test
    # classes of its commit: this takes that archive, waiting for it while the Build may still
    # upload it, and compiles them itself only when no Build of the commit will
    # (dev/varka_matrix_reuse.py), whose `missing` output says why. Any failure of the lookup or
    # the download leaves the compile. A run with `pr`, on vecbricks/varka, compiles: its Build is
    # the fork's, whose artifacts this job's token has not been shown to download.
    - name: Find the Build's test classes
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
      run: |
        if [ -n "$PR" ]; then
          printf 'run=\nmissing=pr\nreason=%s\n' "a run of pull request #$PR reuses no Build" \
            >> "$GITHUB_OUTPUT"
          exit 0
        fi
        ./dev/varka_matrix_reuse.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_OUTPUT" ||
          printf 'run=\nmissing=error\n' >> "$GITHUB_OUTPUT"
    - name: Download the Build's test classes
      if: steps.reuse.outputs.run != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: varka-option-matrix-build
        path: target/varka-reuse
        run-id: ${{ steps.reuse.outputs.run }}
        github-token: ${{ github.token }}
    # The same Build's record of which configurations move each test (VarkaTestReach), taken
    # only when every one of its varka-scoped sql jobs succeeded and left its part: a
    # configuration then runs only the tests it moves, and without the record it runs every
    # test. The classes come about four minutes into a Build and the sql jobs finish four to six
    # minutes later, so the lookup waits up to 10 minutes while they still run: the record saves
    # about 136 bin-minutes, 4.5 minutes of bins at 30 slots (m8/results/
    # VARKA-matrix-bins-1030.txt, sections 1 and 5).
    - name: Find the Build's reach
      id: reach
      if: steps.reuse.outputs.run != ''
      env:
        GH_TOKEN: ${{ github.token }}
        REUSE_RUN: ${{ steps.reuse.outputs.run }}
      run: |
        ./dev/varka_matrix_reuse.py reach "$GITHUB_REPOSITORY" "$REUSE_RUN" --wait 10 \
          >> "$GITHUB_OUTPUT" || printf 'reach=\nreach_state=error\n' >> "$GITHUB_OUTPUT"
    - name: Download the Build's reach
      if: steps.reach.outputs.reach == '1'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: varka-matrix-reach-*
        path: target/varka-reach
        run-id: ${{ steps.reuse.outputs.run }}
        github-token: ${{ github.token }}
    # The same Build's expression harness plans and Spark's answers (VarkaHarnessStore), every
    # sql job's files in one directory: a configuration's harness takes them instead of planning
    # and computing them again. Whatever is missing - no file, a job that wrote none, a file of
    # another commit, which the harness ignores - it plans and computes itself, as without them.
    - name: Download the Build's harness store
      if: steps.reuse.outputs.run != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: varka-harness-store-*
        path: target/varka-harness-store
        merge-multiple: true
        run-id: ${{ steps.reuse.outputs.run }}
        github-token: ${{ github.token }}
    # Without the Build's reach record every configuration runs every test, which costs more
    # bins and bin-minutes (m8/results/VARKA-matrix-bins-1030.txt), so the step names the reason
    # in a warning annotation on the run; the run goes on all the same.
    - name: Build the test classes
      env:
        REUSE_RUN: ${{ steps.reuse.outputs.run }}
        REUSE_MISSING: ${{ steps.reuse.outputs.missing }}
        REUSE_REASON: ${{ steps.reuse.outputs.reason }}
        REACH_STATE: ${{ steps.reach.outputs.reach_state }}
      run: |
        reused=0
        if [ -s target/varka-reuse/varka-matrix-build.tar ]; then
          echo "== the test classes of Build run ${{ steps.reuse.outputs.run }}"
          if ./dev/varka_matrix_archive.sh unpack target/varka-reuse/varka-matrix-build.tar \
              target/varka-matrix &&
            ./dev/varka_matrix.sh --skip-build --build-dir target/varka-matrix --build-only \
              --out target/varka-matrix; then
            reused=1
          else
            echo "== the Build's test classes did not unpack or list the configurations"
          fi
          rm -f target/varka-reuse/varka-matrix-build.tar
        fi
        if [ "$reused" = 0 ]; then
          if [ -n "$REUSE_RUN" ]; then
            why="the test classes of Build run $REUSE_RUN did not download or unpack"
          elif [ "$REUSE_MISSING" = classes ]; then
            why="$REUSE_REASON; rerun that Build's classes job, then dispatch this again"
          elif [ "$REUSE_MISSING" = late ]; then
            why="$REUSE_REASON; wait for it, then dispatch this again"
          elif [ "$REUSE_MISSING" = admit ]; then
            why="$REUSE_REASON; dispatch the matrix after the Build finishes"
          elif [ "$REUSE_MISSING" = pr ]; then
            why="$REUSE_REASON"
          elif [ "$REUSE_MISSING" = none ]; then
            why="$REUSE_REASON: a change that builds neither catalyst nor sql, a Build held by"
            why+=" ci-hold, or no Build yet; dispatch this again once the Build's Varka jobs"
            why+=" have run"
          else
            why="dev/varka_matrix_reuse.py or the GitHub API failed; see the step before"
          fi
          echo "::warning::No reach record, so every configuration runs every test: $why."
          ./dev/varka_matrix.sh --build-only --sbt-arg -Phive --out target/varka-matrix
        elif ls target/varka-reach/*/varka-reach.tsv > /dev/null 2>&1; then
          # The record holds for the commit it was made on, which is this one.
          cat target/varka-reach/*/varka-reach.tsv > target/varka-matrix/reach.tsv
          echo "== the reach of Build run $REUSE_RUN:" \
            "$(grep -vc '^#' target/varka-matrix/reach.tsv) tests"
        else
          case "$REACH_STATE" in
            running)
              why="the Varka sql jobs of Build run $REUSE_RUN were still running 10 minutes on,"
              why+=" so their record is not written yet; dispatch this again once they finish"
              ;;
            failed)
              why="a Varka sql job of Build run $REUSE_RUN failed or left no record" ;;
            absent)
              why="Build run $REUSE_RUN ran no Varka sql job" ;;
            complete)
              why="the reach record of Build run $REUSE_RUN did not download" ;;
            *)
              why="the lookup of Build run $REUSE_RUN's record failed; see the step before" ;;
          esac
          echo "::warning::No reach record, so every configuration runs every test: $why."
        fi
        # The harness store rides in the classpath's archive to the bins, as the reach does, and
        # only with the Build's classes, which it was written by.
        if [ "$reused" = 1 ] && compgen -G "target/varka-harness-store/harness-*.bin" > /dev/null
        then
          mkdir -p target/varka-matrix/harness-store
          cp target/varka-harness-store/harness-*.bin target/varka-matrix/harness-store/
          files=(target/varka-matrix/harness-store/harness-*.bin)
          echo "== the harness store of Build run ${{ steps.reuse.outputs.run }}:" \
            "${#files[@]} files," \
            "$(du -sh target/varka-matrix/harness-store | cut -f1)"
        fi
    # The first stage's suites: those the branch adds or changes since its merge base with
    # Varka's master. The head is the checked-out commit: the dispatched one, or with `pr` the
    # pull request's `sha`, whose `origin` is then vecbricks/varka. Both repositories are public,
    # so no token is needed. The history comes without blobs, about ten megabytes for a thousand
    # commits a side. A failure lists no suite, and the second stage then runs everything.
    - name: Find the changed suites
      env:
        HEAD_SHA: ${{ inputs.pr != '' && inputs.sha || github.sha }}
      run: |
        mkdir -p target/varka-bins
        : > target/varka-bins/changed
        if git fetch -q --no-tags --filter=blob:none --depth=1000 origin "$HEAD_SHA" &&
          git remote add varka "https://github.com/$VARKA_BASE_REPO.git" &&
          git fetch -q --no-tags --filter=blob:none --depth=1000 varka master &&
          base=$(git merge-base varka/master "$HEAD_SHA"); then
          if ./dev/varka_matrix_scope.py "$base" "$HEAD_SHA" --suites > target/varka-bins/changed
          then
            echo "== changed suites since $base: $(paste -sd, target/varka-bins/changed)"
          else
            echo "::warning::The changed suites were not listed, so none runs first."
            : > target/varka-bins/changed
          fi
        else
          echo "::warning::No merge base with Varka's master, so no changed suite runs first."
        fi
    # The bins, from the configurations the build listed and each module's suites, in two lists:
    # `first`, the changed suites under every configuration without the reach record, and
    # `rest`, every other unit. The summary's first line gives each
    # list's units and bins. A cut past a matrix's 256 jobs fails the step with the planner's
    # error printed. The record the configurations ran by drops the suites `first` ran whole.
    # With `pr` this workflow is master's but the planner is the pull request's: a head from
    # before the two stages has a planner without `--stages`, which plans one list with the old
    # arguments. That list becomes `rest` and `first` is empty, so the run is a one-stage run.
    - name: Plan the bins
      id: plan
      env:
        STAGES: ${{ inputs.stages }}
      run: |
        set -o pipefail
        for module in sql catalyst; do
          ./dev/varka_matrix.sh --list-suites --module "$module" > "target/varka-bins/$module"
        done
        reach=()
        [ -s target/varka-matrix/reach.tsv ] && reach=(--reach target/varka-matrix/reach.tsv)
        mkdir -p target/varka-ran-by
        help=$(python3 dev/varka_matrix_bins.py plan --help 2>/dev/null || true)
        if [[ "$help" != *--stages* ]]; then
          echo "::warning::The head's planner predates the two stages, so all bins run in one."
          python3 dev/varka_matrix_bins.py plan \
            --configurations target/varka-matrix/configurations \
            --suites sql=target/varka-bins/sql --suites catalyst=target/varka-bins/catalyst \
            --platforms "${reach[@]}" > target/varka-bins/bins.json \
            2> target/varka-bins/plan.txt || { cat target/varka-bins/plan.txt; exit 1; }
          jq -c '{first: [], rest: .include}' target/varka-bins/bins.json \
            > target/varka-bins/plan.json
          if [ -s target/varka-matrix/reach.tsv ]; then
            cp target/varka-matrix/reach.tsv target/varka-ran-by/reach.tsv
          fi
        else
          python3 dev/varka_matrix_bins.py plan \
            --configurations target/varka-matrix/configurations \
            --suites sql=target/varka-bins/sql --suites catalyst=target/varka-bins/catalyst \
            --platforms "${reach[@]}" --stages "${STAGES:-two}" \
            --changed-suites target/varka-bins/changed \
            --ran-by target/varka-ran-by/reach.tsv \
            > target/varka-bins/plan.json 2> target/varka-bins/plan.txt \
            || { cat target/varka-bins/plan.txt; exit 1; }
        fi
        cat target/varka-bins/plan.txt | tee -a "$GITHUB_STEP_SUMMARY"
        echo "first=$(jq -c .first target/varka-bins/plan.json)" >> "$GITHUB_OUTPUT"
        echo "rest=$(jq -c .rest target/varka-bins/plan.json)" >> "$GITHUB_OUTPUT"
    # Every entry of the test classpath, the build's class directories and the dependencies' jars
    # alike, archived at its absolute path, which is the same on every runner, with the classpath
    # and JVM options the bins read.
    - name: Archive the classpath
      run: ./dev/varka_matrix_archive.sh pack target/varka-matrix target/varka-build.tar
    - name: Upload the classpath
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-build
        path: target/varka-build.tar
        retention-days: 1
        compression-level: 1
    # The record the configurations ran by, for the report job's suite weights: a suite's weight
    # is its time run whole, and a configuration that ran only the tests the record let through
    # ran part of it (dev/varka_matrix_bins.py times --reach, VARKA-508).
    - name: Upload the reach the configurations ran by
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-reach
        path: target/varka-ran-by/reach.tsv
        if-no-files-found: ignore
        retention-days: 30

  # On the fork the matrix's own bins take 30 slots and the platform bins (VARKA-505: the defaults
  # under `isa=avx2`, `isa=w128` and `isa=arm`, dev/varka_matrix_bins.py PLATFORMS) 8 more, which
  # is the fork's 40 less the build and report jobs; a bin's `runner` is its job's. One job holds
  # both, so max-parallel is the sum; the planner lists the platform bins first, so they start at
  # once and the matrix's bins take the other slots. On vecbricks/varka all bins share 16 slots,
  # the `slots` input, of its 20. The two stages run one after the other, so each takes all the
  # slots. A run has about a hundred bin jobs, 11 of them
  # platform bins (7 on x86, 4 on Arm) in run 42187218199, which took 39 minutes. A push chain's
  # job ceiling is 40 less the platform bins' 11, and the rows that run beside a matrix wait for
  # it.
  #
  # The first stage. GitHub refuses an empty matrix, so an empty list skips the job. Its bins and
  # the second stage's are numbered as one list, so the job names and artifacts stay unique.
  first:
    name: "Option matrix: ${{ matrix.bin }}"
    needs: build
    if: needs.build.outputs.first != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: >-
        ${{ fromJSON(inputs.slots != '' && inputs.slots
        || (github.repository == 'vecbricks/varka' && '16' || '38')) }}
      matrix:
        include: ${{ fromJSON(needs.build.outputs.first) }}
    # The second stage's job runs these same steps.
    steps: &bin-steps
    # The run's wall time is its slowest bin's, so a setup step that stalls holds back the whole
    # run: in run 40855387471 one bin spent 16.3 minutes installing Java, where the median bin took
    # 8 seconds (VARKA-513). Each setup step of a bin has a timeout a few times its usual length
    # and, when it times out or fails, one retry, which leaves a line the report job prints.
    - name: Checkout
      id: checkout
      uses: actions/checkout@v6
      timeout-minutes: 3
      continue-on-error: true
      with:
        repository: ${{ inputs.pr != '' && env.VARKA_BASE_REPO || github.repository }}
        ref: ${{ inputs.pr != '' && inputs.sha || '' }}
        persist-credentials: false
    - name: Checkout, again
      if: steps.checkout.outcome != 'success'
      uses: actions/checkout@v6
      timeout-minutes: 5
      with:
        repository: ${{ inputs.pr != '' && env.VARKA_BASE_REPO || github.repository }}
        ref: ${{ inputs.pr != '' && inputs.sha || '' }}
        persist-credentials: false
    - name: Install Java 25
      id: java
      uses: actions/setup-java@v5
      timeout-minutes: 3
      continue-on-error: true
      with:
        distribution: zulu
        java-version: '25'
    - name: Install Java 25, again
      if: steps.java.outcome != 'success'
      uses: actions/setup-java@v5
      timeout-minutes: 5
      with:
        distribution: zulu
        java-version: '25'
    # The runner's CPU and the vector width HotSpot uses, before any kernel runs: the pool mixes
    # 256-bit and 512-bit machines, and a bin that fails on one and passes on the other has to be
    # read against the machine it ran on (VARKA-399).
    - name: Record the CPU and the vector width
      uses: ./.github/actions/record-runner-platform
      with:
        dir: target/varka-units/${{ matrix.bin }}/${{ matrix.bin }}-platform
    - name: Download the classpath
      id: classpath
      uses: actions/download-artifact@v4
      timeout-minutes: 8
      continue-on-error: true
      with:
        name: varka-option-matrix-build
        path: target
    - name: Download the classpath, again
      if: steps.classpath.outcome != 'success'
      uses: actions/download-artifact@v4
      timeout-minutes: 10
      with:
        name: varka-option-matrix-build
        path: target
    - name: Record the setup steps retried
      if: >-
        steps.checkout.outcome != 'success' || steps.java.outcome != 'success'
        || steps.classpath.outcome != 'success'
      env:
        BIN: ${{ matrix.bin }}
        CHECKOUT: ${{ steps.checkout.outcome }}
        JAVA: ${{ steps.java.outcome }}
        CLASSPATH: ${{ steps.classpath.outcome }}
      run: |
        dir=target/varka-units/$BIN/$BIN-setup
        mkdir -p "$dir"
        for step in "checkout:$CHECKOUT" "java:$JAVA" "classpath:$CLASSPATH"; do
          if [ "${step#*:}" != success ]; then
            echo "$BIN ${step%%:*} ${step#*:}, retried" | tee -a "$dir/retries.txt"
          fi
        done
        echo "::warning title=Setup step retried::$(paste -sd ';' "$dir/retries.txt")"
    - name: Unpack the classpath
      run: |
        ./dev/varka_matrix_archive.sh unpack target/varka-build.tar target/varka-matrix
        rm target/varka-build.tar
    # Each unit is one runner JVM, two at a time on the runner's four cores and 16 GB, each in a
    # directory of its own named by the bin, so that the report job can merge every bin's runs.
    # The small-tree series at size 4, which pull requests no longer run (VARKA-269 9): every
    # configuration meets every tree to size 4, IfElse included.
    #
    # A runner can be many times slower than the pool: run 40942811546's b021 ran 91 minutes on an
    # EPYC 9V74 against a median bin of 8, and a job keeps the runner it was given. So a watchdog
    # beside the units stops them at three times the bin's planned seconds, floored at four of
    # the planner's 480 s lanes, 32 minutes: the longest green units step of 19 runs took 24.3
    # (m8/results/VARKA-570-units-history.txt). It writes what ran to
    # <bin>-straggler/straggler.txt and fails the step with a `Straggler`
    # annotation and exit 3, so the run completes and its failed jobs can be rerun on other
    # runners. Each unit runs in a process group of its own, so that it is stopped by its group
    # and never by a pattern. dev/varka_bin_units_test.py runs this text.
    - name: Run this bin's units
      env:
        UNITS: ${{ matrix.units }}
        BIN: ${{ matrix.bin }}
        REACH: ${{ matrix.reach }}
        PLAN_SECONDS: ${{ matrix.seconds }}
        PLANT: ${{ inputs.plant-straggler }}
        DEADLINE_FLOOR: '1920'
        GRACE: '30'
      run: |
        out=target/varka-units/$BIN
        strag=$out/$BIN-straggler
        mkdir -p "$out"
        deadline=$((3 * PLAN_SECONDS))
        [ "$deadline" -ge "$DEADLINE_FLOOR" ] || deadline=$DEADLINE_FLOOR
        STARTED=$(date +%s)
        export out strag deadline STARTED
        # The step's shell is bash -e: a unit's status is captured, so that a failing unit
        # neither ends the step before the others run nor goes unrecorded.
        # shellcheck disable=SC2329 # run in its own group, by bash -c
        run_unit() {
          local k=$1 config=$2 module=$3 suites=$4 flags=$5 mode status=0 flag t0=$SECONDS
          if [ "$config" = defaults ]; then
            mode=(--defaults)
          elif [ -n "$flags" ] || [[ "$config" == isa=* ]]; then
            # A platform (VARKA-505): the defaults under fixed JVM flags, every test, in
            # runs/<platform>.
            mode=(--defaults --platform "$config")
            for flag in $flags; do mode+=(--jvm-arg "$flag"); done
          else
            mode=(--config "$config")
          fi
          # A configuration runs only the tests the Build's record says it moves, but in a bin
          # of the first stage's changed suites, whose `reach` is `off`.
          if [ "$config" != defaults ] && [[ "$config" != isa=* ]] && [ "$REACH" != off ] && \
              [ -s target/varka-matrix/reach.tsv ]; then
            mode+=(--jvm-arg "-Dvarka.matrix.reachFile=$PWD/target/varka-matrix/reach.tsv")
          fi
          # A configuration's harness takes the plans and answers the Build's defaults wrote.
          if [ "$config" != defaults ] && [[ "$config" != isa=* ]] && \
              compgen -G "target/varka-matrix/harness-store/harness-*.bin" > /dev/null; then
            mode+=(--jvm-arg "-Dvarka.harness.store=$PWD/target/varka-matrix/harness-store")
          fi
          ./dev/varka_matrix.sh --skip-build --build-dir target/varka-matrix --runs-only \
            --out "$out/$BIN-u$k" --leaf-suffix "$BIN-$k" --module "$module" --suites "$suites" \
            "${mode[@]}" --jvm-arg -Dvarka.series.size=4 > "$out/$BIN-u$k.log" 2>&1 || status=$?
          echo "$((SECONDS - t0))" > "$out/$BIN-u$k.seconds"
          # For the stage gate, at once, so that a job stopped later by its timeout or a cancel
          # still uploads it: a unit that failed. A straggler or a setup step leaves none, since
          # a unit the watchdog stops never gets here.
          if [ "$status" != 0 ]; then
            mkdir -p "$out/$BIN-failed"
            echo "exit $status: $config|$module|$suites" >> "$out/$BIN-failed/units.txt"
          fi
          echo "$status" > "$out/$BIN-u$k.exit"
        }
        # Signals every unit still without an exit file, by its process group.
        # shellcheck disable=SC2329 # run in its own group, by bash -c
        stop_units() {
          local f
          for f in "$out"/*-u*.pgid; do
            [ -e "$f" ] && [ ! -e "${f%.pgid}.exit" ] && kill "-$1" -- "-$(cat "$f")" 2>/dev/null
          done
          return 0
        }
        # shellcheck disable=SC2329 # run in its own group, by bash -c
        watchdog() {
          local f now cpu
          sleep "$deadline"
          # From here it finishes what it starts: the TERM the step sends its group once the
          # units end no longer stops it, nor the sleep of its grace.
          trap '' TERM
          now=$(date +%s)
          cpu=$(grep -h -m1 '^CPU' "$out/$BIN-platform/platform.txt" 2>/dev/null)
          cpu=${cpu#CPU: }
          mkdir -p "$strag"
          {
            echo "$BIN: planned $PLAN_SECONDS s, deadline $deadline s, stopped at" \
              "$((now - STARTED)) s"
            echo "CPU: ${cpu:-unknown}"
            for f in "$out"/*-u*.unit; do
              [ -e "$f" ] || continue
              if [ -e "${f%.unit}.exit" ]; then
                echo "finished, exit $(cat "${f%.unit}.exit") in $(cat "${f%.unit}.seconds") s:" \
                  "$(cat "$f")"
              else
                echo "running, stopped: $(cat "$f")"
              fi
            done
          } > "$strag/straggler.tmp"
          mv "$strag/straggler.tmp" "$strag/straggler.txt"
          stop_units TERM
          sleep "$GRACE"
          stop_units KILL
          echo "::error title=Straggler::$BIN ran $(((now - STARTED) / 60)) min against a plan" \
            "of $(((PLAN_SECONDS + 30) / 60)) min on ${cpu:-an unknown CPU}; stopped"
        }
        export -f run_unit stop_units watchdog
        # setsid execs in place, since a background job of a shell without job control is never
        # a group leader, so $! is the new group's id.
        setsid bash -c watchdog &
        wpid=$!
        # The dispatch input plant-straggler: this bin sleeps past its deadline, as a slow runner
        # would, and the watchdog stops it.
        if [ -n "$PLANT" ] && [ "$PLANT" = "$BIN" ]; then
          echo "planted straggler: sleep past the deadline" > "$out/$BIN-uplanted.unit"
          setsid sleep $((deadline + 600)) &
          echo "$!" > "$out/$BIN-uplanted.pgid"
          wait "$!" || true
        fi
        # The units' PIDs, so that neither wait waits on the watchdog.
        running=()
        reap_one() {
          local done_pid="" p keep=()
          wait -n -p done_pid "${running[@]}" || true
          for p in "${running[@]}"; do
            if [ "$p" != "$done_pid" ] && kill -0 "$p" 2>/dev/null; then keep+=("$p"); fi
          done
          running=("${keep[@]}")
        }
        k=0
        while IFS='|' read -r config module suites flags; do
          [ -n "$config" ] || continue
          if [ -e "$strag/straggler.txt" ]; then
            echo "not run: $config|$module|$suites" >> "$strag/straggler.txt"
          else
            echo "$config|$module|$suites" > "$out/$BIN-u$k.unit"
            setsid bash -c 'run_unit "$@"' _ "$k" "$config" "$module" "$suites" "$flags" &
            echo "$!" > "$out/$BIN-u$k.pgid"
            running+=("$!")
            if [ "${#running[@]}" -ge 2 ]; then reap_one; fi
          fi
          k=$((k + 1))
        done <<< "$UNITS"
        while [ "${#running[@]}" -gt 0 ]; do reap_one; done
        # A bin on time ends with its units: the watchdog, still asleep, is stopped with its
        # sleep; one that has fired ignores this and is waited for.
        kill -TERM -- "-$wpid" 2>/dev/null || true
        wait "$wpid" || true
        status=0
        for f in "$out"/*-u*.exit; do
          [ -e "$f" ] || continue
          if [ "$(cat "$f")" != 0 ]; then
            echo "== ${f%.exit}.log:"; tail -40 "${f%.exit}.log"; status=1
          fi
        done
        if [ -e "$strag/straggler.txt" ]; then
          echo "== $strag/straggler.txt:"; cat "$strag/straggler.txt"; status=3
        fi
        exit "$status"
    # A rerun's upload of the same name keeps the earlier attempt's artifact, a straggler's record
    # among them, and the report's download takes the newest of each name: run 40942811546's
    # attempt 2 found two varka-option-matrix-b021 and downloaded the rerun's alone.
    - name: Upload the bin's runs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-${{ matrix.bin }}
        path: |
          target/varka-units/${{ matrix.bin }}/*-platform/platform.txt
          target/varka-units/${{ matrix.bin }}/*-setup/retries.txt
          target/varka-units/${{ matrix.bin }}/*-straggler/straggler.txt
          target/varka-units/${{ matrix.bin }}/*-failed/units.txt
          target/varka-units/${{ matrix.bin }}/*-u*.log
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/name
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/exit
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/seconds
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/run.log
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/fused.tsv
          target/varka-units/${{ matrix.bin }}/*-u*/runs/*/*/junit/*.xml
        if-no-files-found: ignore
        retention-days: 30

  # Whether a red first stage failed a test. A bin fails on a unit that failed, on the watchdog's
  # stop of a slow runner (VARKA-570) or on a setup step that failed twice, and only the first
  # writes <bin>-failed/units.txt; so the second stage goes on after stragglers and setup
  # failures, whose run still ends red, and stops after a failed unit. Records that do not
  # download stop it too. A bin stopped by its job timeout has uploaded the units that failed
  # before the stop, which stop the second stage; with none it counts as a setup failure when
  # the stage's result is `failure`, and a stage `cancelled` stops the second. Only the first
  # stage's bins are read: a rerun of failed jobs downloads the earlier attempt's second-stage
  # bins too, whose records say nothing of this stage.
  gate:
    name: "Option matrix: stage gate"
    needs: [build, first]
    if: ${{ !cancelled() && needs.first.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.judge.outputs.tests }}
    steps:
    - name: Download the first stage's records
      id: records
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: varka-option-matrix-b[0-9]*
        path: target/varka-bins
        merge-multiple: true
    - name: Judge the first stage's failures
      id: judge
      env:
        DOWNLOAD: ${{ steps.records.outcome }}
        FIRST: ${{ needs.build.outputs.first }}
      run: |
        failed=() stragglers=()
        for b in $(jq -r '.[].bin' <<< "$FIRST"); do
          f=target/varka-bins/$b-failed/units.txt
          [ -e "$f" ] && failed+=("$f")
          f=target/varka-bins/$b-straggler/straggler.txt
          [ -e "$f" ] && stragglers+=("$f")
        done
        if [ "$DOWNLOAD" != success ]; then
          echo "::error::The first stage's records did not download, so the second stage waits."
          echo "tests=unknown" >> "$GITHUB_OUTPUT"
        elif [ "${#failed[@]}" -gt 0 ]; then
          echo "== the first stage's failed units, so the second stage does not run:"
          cat "${failed[@]}"
          echo "tests=failed" >> "$GITHUB_OUTPUT"
        else
          echo "== no unit of the first stage failed, so the second stage runs; its stragglers:"
          if [ "${#stragglers[@]}" -gt 0 ]; then cat "${stragglers[@]}"; else echo "none"; fi
          echo "tests=passed" >> "$GITHUB_OUTPUT"
        fi

  # The second stage: every other unit. It runs when the first succeeded, was skipped for an
  # empty list, or failed with no unit failed (the gate), and not after a failed unit or a
  # cancelled first stage (a bin past its job timeout is judged by the gate as above). A plain
  # `needs` would skip it with a skipped first, and a diff
  # that changes no suite would end green with no bins.
  rest:
    name: "Option matrix: ${{ matrix.bin }}"
    needs: [build, first, gate]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.first.result == 'success' || needs.first.result == 'skipped'
      || (needs.first.result == 'failure' && needs.gate.outputs.tests == 'passed'))
      && needs.build.outputs.rest != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: >-
        ${{ fromJSON(inputs.slots != '' && inputs.slots
        || (github.repository == 'vecbricks/varka' && '16' || '38')) }}
      matrix:
        include: ${{ fromJSON(needs.build.outputs.rest) }}
    steps: *bin-steps

  report:
    name: "Option matrix: report"
    needs: [build, first, gate, rest]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.pr != '' && env.VARKA_BASE_REPO || github.repository }}
        ref: ${{ inputs.pr != '' && inputs.sha || '' }}
        persist-credentials: false
    - name: Download every bin's runs
      uses: actions/download-artifact@v4
      with:
        pattern: varka-option-matrix-b[0-9]*
        path: target/varka-bins
        merge-multiple: true
    # Every unit's runs/ into one: a configuration's directory gathers the JVM directories of all
    # its units, which their bin names keep apart; the report then reads one run of the matrix.
    # A straggler's units are merged too. The group TERM ends dev/varka_matrix.sh before it writes
    # a stopped JVM's exit file, or the configuration's name file when that JVM was its only one,
    # so the report lists the JVM as not finished or leaves the configuration out, and fails on
    # neither; a unit that finished before the stop is judged as any other, so a test it failed
    # still fails the report.
    - name: Merge the runs
      run: |
        mkdir -p target/varka-merged/runs
        for runs in target/varka-bins/*-u*/runs; do
          cp -r "$runs"/. target/varka-merged/runs/
        done
        echo "sql catalyst" > target/varka-merged/runs/modules
    - name: Report
      run: |
        set -o pipefail
        ./dev/varka_matrix.sh --report-only target/varka-merged | tee target/varka-matrix-report.txt
    - name: Summary
      if: always()
      env:
        FIRST: ${{ needs.first.result }}
        REST: ${{ needs.rest.result }}
        TESTS: ${{ needs.gate.outputs.tests }}
      run: |
        {
          echo "## Option matrix"
          if [ "$REST" = skipped ] && [ "$FIRST" != success ] && [ "$FIRST" != skipped ] &&
            [ "$TESTS" != passed ]; then
            case "$TESTS" in
              failed) why="a unit of it failed" ;;
              unknown) why="its records did not download" ;;
              *) why="it ended $FIRST" ;;
            esac
            echo "The second stage did not run, since $why: this report and the suite seconds"
            echo "cover the first stage's bins only."
          elif [ "$FIRST" = failure ] && [ "$REST" != skipped ]; then
            echo "The first stage's failed bins failed no unit - stragglers or setup steps, listed"
            echo "below - so the second ran. Their units have no answer here: dispatch again for"
            echo "them; a rerun of the failed jobs reruns the whole second stage too."
          elif [ "$FIRST" = failure ]; then
            echo "The first stage's failed bins failed no unit - stragglers or setup steps, listed"
            echo "below - and the second stage had no bins. Their units have no answer here:"
            echo "dispatch again for them."
          fi
          echo '```'
          sed -n '/^configuration/,$p' target/varka-matrix-report.txt 2>/dev/null || echo "no report"
          echo '```'
          # The machines the bins ran on, so that an unfused line can be read against them.
          echo "Bins by CPU:"
          echo '```'
          grep -h '^CPU' target/varka-bins/*-platform/platform.txt | sort | uniq -c || true
          echo '```'
          # Each platform's runner CPU and the JVM's own flags there (VARKA-505): a forced
          # UseAVX=2 on a host whose JVM already reads UseAVX=2 is a no-op, not coverage.
          echo "Platform bins (flags forced; JVM: is the host's own):"
          echo '```'
          for d in target/varka-bins/b*-u*/runs/isa=*; do
            [ -d "$d" ] || continue
            bin=$(basename "$(dirname "$(dirname "$d")")")
            bin=${bin%-u*}
            platform=$(basename "$d")
            flags=$(python3 -c 'import sys; sys.path.insert(0, "dev"); \
              import varka_matrix_bins as m; print(m.PLATFORMS[sys.argv[1]][1] or "defaults")' \
              "$platform")
            file=target/varka-bins/$bin-platform/platform.txt
            echo "$platform [$flags] $(grep -h '^CPU' "$file")" \
              "$(grep -h '^JVM' "$file")"
          done | sort | uniq -c
          echo '```'
          # The bins the watchdog stopped at three times their plan (VARKA-570): the runner's
          # CPU, and each unit's state; a unit stopped or not run has no answer in this report.
          echo "Stragglers (stopped; rerun the run's failed jobs to run them on other runners):"
          echo '```'
          cat target/varka-bins/*-straggler/straggler.txt 2>/dev/null || echo "none"
          echo '```'
          # The bins a setup step held back, each retried once (VARKA-513).
          echo "Setup steps retried:"
          echo '```'
          cat target/varka-bins/*-setup/retries.txt 2>/dev/null || echo "none"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Download the reach the configurations ran by
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: varka-option-matrix-reach
        path: target/varka-run-reach
    # Each suite's seconds run whole, its median over the configurations that ran all of it, and
    # its seconds under each of them, from this run's JUnit reports, for the next plan's weights
    # (sql/varka/matrix/suite-seconds.tsv and config-suite-seconds.tsv).
    - name: Suite seconds
      if: always()
      run: |
        python3 dev/varka_matrix_bins.py times --reach target/varka-run-reach/reach.tsv \
          --per-configuration target/config-suite-seconds.tsv \
          target/varka-merged/runs > target/suite-seconds.tsv
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: varka-option-matrix-report
        path: |
          target/varka-matrix-report.txt
          target/suite-seconds.tsv
          target/config-suite-seconds.tsv
        if-no-files-found: ignore
        retention-days: 30

  report-failure:
    name: Report a failed run
    # The build job admits no scheduled run until row 522 turns the schedule to the fork.
    # Only a scheduled run, since a person who dispatches one sees its result; only on the
    # project's own repository, where issues are on; and when a job failed or was cancelled.
    # The script lists every failed, timed-out or cancelled job, a cancelled one with a note.
    needs: [build, first, gate, rest, report]
    if: >-
      always() && github.event_name == 'schedule' && github.repository == 'vecbricks/varka'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          dev
    - name: Report the failure
      uses: ./.github/actions/report-scheduled-failure
      with:
        needs: ${{ toJSON(needs) }}
