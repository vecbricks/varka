# VARKA-62's PR (B): the date surface, run against three Spark distributions on a
# GitHub runner, per VARKA-62.md section 11.
#
# Why this is a sibling of benchmark.yml and not a mode of it (2.2): that one builds
# this checkout's test jars and submits them through its own bin/spark-submit under a
# single setup-java, while this driver is a plain application that must run on a
# *downloaded* Spark under two JDKs.
#
# The steps are ordered so that a miss is cheap. There is no pinned runner to have -
# GitHub's pool spans four CPU families within one regeneration and does reach genuine
# full-width AVX-512 Intel Xeons - so the gate below records the CPU as Spark's own
# benchmarks do and then decides on the *datapath probe*, because "512-bit datapath"
# is a property and not a model name. Everything after the gate is expensive;
# everything in it is seconds, which is what makes re-dispatching until the pool gives
# the right machine a workable strategy rather than a gamble.
name: Varka date surface benchmark

on:
  workflow_dispatch:
    inputs:
      stop-after:
        type: choice
        description: 'How far to go. "gate" surveys one runner and stops - it is the pool census of 11.9 and enforces nothing, since its VM is not the one that would measure. "build" also warms the commit-keyed jar cache from any runner, so a later gated dispatch pays only the run (11.10). "run" measures.'
        required: true
        default: 'gate'
        options:
          - 'gate'
          - 'build'
          - 'run'
      require-datapath:
        type: choice
        description: 'Abort the measurement unless the datapath probe, run on the measuring machine itself, says the vector unit is this wide. Ignored by "stop-after: gate", which surveys the pool and so must not abort on the machines it is counting. See VARKA-62.md 11.15.'
        required: true
        default: '512'
        options:
          - '512'
          - 'any'
      expected-cpu:
        type: string
        description: 'Expected CPU model, as benchmark.yml means it (e.g. "Intel(R) Xeon(R) Platinum 8370C"). Documentation and deliberate repeats; the probe is the gate.'
        required: false
        default: ''
      rows:
        description: 'Rows in the cached table. 1e8 is the only count measured resident on a runner - 2e8 is not, at any partition count or driver memory tried, and a non-resident run times the disk (VARKA-62.md 11.12). The laptop files are 1e9.'
        required: true
        default: '100000000'
      partitions:
        description: 'Partitions. One, per VARKA-62.md 2.6, unless memory forces more.'
        required: true
        default: '1'
      driver-memory:
        description: 'Driver memory. The shell driver defaults to the laptop 16g; benchmark.yml uses 6g because the runner is the binding constraint.'
        required: true
        default: '6g'
      only:
        type: string
        description: 'Surface entry regex, for a partial re-run'
        required: false
        default: ''
      benchmark:
        type: choice
        description: 'Which expressions. "surface" is one entry per expression, the coverage document, whose lightest rows are memory-bandwidth-bound and so cannot show a datapath difference. "chains" composes them three and four deep until the kernel is compute-bound, which is what a 512-bit run has to measure. See VARKA-62.md 11.13. "time" and "timechains" are the same pair over the TIME table (VARKA-164.md).'
        required: true
        default: 'surface'
        options:
          - 'surface'
          - 'chains'
          - 'time'
          - 'timechains'
          - 'ladder'
      input:
        type: choice
        description: 'Where the table rows come from. "cache" is each distribution default cache (Arrow on the Varka arm). "parquet" writes the table to a Parquet file once and reads it back uncached, the path a query over a file takes; VARKA-194 asks the ladder both ways. The file name gains "-parquet".'
        required: false
        default: 'cache'
        options:
          - 'cache'
          - 'parquet'
      shard:
        type: string
        description: 'I/N - run entries I, I+N, I+2N of the surface, so N dispatches cover it once. For the row count the fixed-share rule wants, the whole surface does not fit one job. Merge with dev/varka_bench_merge.py. See VARKA-62.md 11.11.'
        required: false
        default: ''
      max-fixed-share:
        type: string
        description: 'The ceiling the driver holds a Varka row to: the job constant (scheduling a task, collecting its result) as a share of that row wall time. 5 is the standing rule. It is lifted only where a benchmark has been outrun by the engine - the TIME chains on a full-width runner do 0.4 s of work per iteration against a 36 ms constant, and no row count that fits a 15 GiB machine brings that under 5% - and wherever a lifted bound produced a committed number, the README methodology says so. The constant inflates every arm alike, so it compresses a ratio rather than flattering it.'
        required: false
        default: '5'
      extra-confs:
        type: string
        description: 'Comma-separated key=value settings appended to every arm, stock and fork alike, e.g. spark.driver.extraJavaOptions=-XX:UseAVX=2,spark.sql.codegen.varka.emit.useAVX=2 for VARKA-121 (in local[1] the driver is the executor, so the JVM flag reaches the kernels). Empty appends nothing.'
        required: false
        default: ''
      vecruntime:
        type: boolean
        description: 'Add two arms on Spark 4.1.3, the release vecruntime supports: stock, and with the vecruntime plugin, every case held to the plugin''s own nodes (VARKA-202). Parquet input only, since the plugin leaves a cached table to Spark.'
        required: false
        default: false
      create-commit:
        type: boolean
        description: 'Commit the results files to this branch'
        required: true
        default: false

jobs:
  # Three jobs, not one, and VARKA-62.md 11.10 is why. The qualifying runner turned
  # out to be one in eighteen, so asking it to do a cold build *and* the four runs inside
  # one six-hour limit risks forfeiting both - and the cache with them, since a cancelled
  # job never reaches its post step. The build does not care what machine it lands on;
  # only the measurement does. Split apart, each half gets its own six-hour budget, and a
  # `build-only` dispatch warms the commit-keyed jar cache from any runner so that the
  # lucky one pays for the run alone.
  #
  # But the split does not chain, and 11.15 is what that cost. Every GitHub job is a
  # fresh ephemeral VM, so a gate passed in one job says nothing about the machine
  # another job gets: the chains run of 12 September passed the gate on an EPYC 9V45 at
  # ratio 2.00 and then measured on an EPYC 9V74 at ratio 1.00, under a job name that
  # interpolated the gate's CPU and so displayed the wrong machine. The datapath gate
  # therefore runs *inside* `measure`, against the VM that will do the measuring, and
  # `gate` is now only the pool survey that `stop-after: gate` dispatches - it is not
  # upstream of anything. Making it upstream would be worse than useless: a `512`
  # dispatch would need the gate's VM *and* the measure VM to be full-width, squaring
  # a one-in-eighteen chance into one in three hundred.
  gate:
    name: "Survey this runner"
    if: ${{ inputs.stop-after == 'gate' }}
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.probe.outputs.cpu }}
      lanes: ${{ steps.probe.outputs.lanes }}
      control: ${{ steps.probe.outputs.control }}
      ratio: ${{ steps.probe.outputs.ratio }}
    steps:
    - name: Checkout Varka
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Before the gate, not after: Datapath.java imports jdk.incubator.vector and runs with
    # --add-modules jdk.incubator.vector, so the runner's preinstalled JDK cannot be
    # assumed to serve it. Cached, this is seconds, and the gate still costs a minute
    # rather than hours.
    - name: Install JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'

    # The survey, with no verdict attached: `require-datapath` is deliberately not
    # passed here. This job exists to census the pool (it is how the eighteen-runner
    # table in VARKA-62.md 11.9 was taken), and a census that aborts on the machines
    # it is trying to count is not a census. The gate that decides a measurement lives in
    # `measure`, on the machine that measures.
    - name: Survey the machine and probe its datapath
      id: probe
      env:
        EXPECTED_CPU: ${{ inputs.expected-cpu }}
      run: dev/varka_datapath.sh --require any --expected-cpu "$EXPECTED_CPU" --github

  build:
    name: "Build"
    if: ${{ inputs.stop-after != 'gate' }}
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: localhost
    steps:
    - name: Checkout Varka
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # JDK 25 and nothing else. The fork compiles with `--release 25` (pom.xml's
    # java.version) and sql/varka/engine with `maven.compiler.release` 25, so a JAVA_HOME
    # of 17 cannot build this tree at all. JDK 17 belongs in the measure job, where the
    # stock-Spark arms run under it.
    - name: Install JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'

    - name: Restore the jars built for this commit
      id: jars
      uses: actions/cache@v5
      with:
        path: |
          assembly/target/scala-2.13/jars
          sql/varka/bench/target/*.jar
          sql/varka/engine/target/varka-engine-*.jar
          conf/log4j2.properties
        key: varka-surface-jars-${{ github.sha }}

    - name: Cache SBT, Maven and Coursier
      if: ${{ steps.jars.outputs.cache-hit != 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
          ~/.cache/coursier
        key: varka-surface-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt') }}
        restore-keys: |
          varka-surface-

    - name: Build the fork, the driver jar and the engine jar
      if: ${{ steps.jars.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        cp conf/log4j2.properties.template conf/log4j2.properties
        sed -i 's/rootLogger.level = info/rootLogger.level = warn/g' conf/log4j2.properties
        # The assembly, so this checkout's own bin/spark-submit runs it as a distribution.
        ./build/sbt -Pscala-2.13 -Phive -Phive-thriftserver package
        # The driver, compiled against the *released* Spark at provided scope, and the
        # engine jar. The latter is not optional and its absence is silent: a distribution
        # with Varka on and no engine jar falls back on every batch with a
        # ClassNotFoundException in the log and measures the row engine under the kernel's
        # name (ISSUES.md, "The engine jar is not in the distribution").
        ./build/mvn -f sql/varka/bench/pom.xml -q -DskipTests package
        ./build/mvn -f sql/varka/engine/pom.xml -q -DskipTests package

  measure:
    # Named for the inputs, never for a CPU: the name is fixed before any job runs, so
    # the only CPU it could interpolate is another job's, which is exactly the error
    # 11.15 records. This job's own machine is in its probe annotation and in the
    # provenance of every results file it writes.
    name: "Measure ${{ inputs.benchmark }} at ${{ inputs.rows }} rows"
    needs: build
    if: ${{ inputs.stop-after == 'run' }}
    runs-on: ubuntu-latest
    # Only the commit step needs more than read, and only when asked for.
    permissions:
      contents: write
    env:
      SPARK_LOCAL_IP: localhost
      STOCK_VERSION: 4.2.0
      # vecruntime's arm (VARKA-202): its release, the Spark release it supports, and the Hadoop
      # client that release needs on JDK 25 in place of the one it bundles.
      VECRUNTIME_VERSION: 0.0.3
      VECRUNTIME_SPARK_VERSION: 4.1.3
      VECRUNTIME_HADOOP_CLIENT: 3.4.3
    steps:
    - name: Checkout Varka
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Both, and 17 first so that JAVA_HOME ends at 25. The surface script addresses each
    # by JAVA_HOME_<n>_X64 anyway; the ordering only decides what a bare `java` is.
    - name: Install JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '17'

    - name: Install JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '25'

    # The gate, on the machine that will do the measuring, and placed here on purpose:
    # after the JDKs, because the probe needs `jdk.incubator.vector`, and before the
    # 400 MB jar restore and the stock distribution download, because a `512` dispatch
    # is expected to miss seventeen times out of eighteen and a miss should cost
    # seconds. A gate in any other job gates the wrong machine - VARKA-62.md 11.15.
    - name: Gate - is this the machine this measurement needs?
      id: probe
      env:
        EXPECTED_CPU: ${{ inputs.expected-cpu }}
        REQUIRE_DATAPATH: ${{ inputs.require-datapath }}
      run: |
        dev/varka_datapath.sh --require "$REQUIRE_DATAPATH" \
          --expected-cpu "$EXPECTED_CPU" --github

    - name: Restore the jars built for this commit
      uses: actions/cache/restore@v5
      with:
        path: |
          assembly/target/scala-2.13/jars
          sql/varka/bench/target/*.jar
          sql/varka/engine/target/varka-engine-*.jar
          conf/log4j2.properties
        key: varka-surface-jars-${{ github.sha }}
        fail-on-cache-miss: true

    - name: Record the machine this job measured on
      id: tag
      env:
        SHARD: ${{ inputs.shard }}
        BENCHMARK: ${{ inputs.benchmark }}
        PROBE_CPU: ${{ steps.probe.outputs.cpu }}
        PROBE_LANES: ${{ steps.probe.outputs.lanes }}
        PROBE_CONTROL: ${{ steps.probe.outputs.control }}
        PROBE_RATIO: ${{ steps.probe.outputs.ratio }}
      run: |
        # From this job's own probe, a step above. It used to read the gate job's
        # outputs, which described a different VM entirely (11.15).
        echo "::notice::measuring on $PROBE_CPU - $PROBE_LANES lane-ops/ns at 128/256/512 bits; control $PROBE_CONTROL, 512:256 $PROBE_RATIO"
        # An artifact name may not contain a slash, and a shard is spelled I/N.
        # The surface keeps the artifact name it has had, so a hand-typed
        # `gh run download -n varka-surface-results` keeps working; only the new
        # benchmark takes a suffix.
        suffix=""
        [ "$BENCHMARK" != "surface" ] && suffix="-$BENCHMARK"
        echo "slug=${suffix}${SHARD:+-shard${SHARD//\//of}}" >> "$GITHUB_OUTPUT"

    # restore/save rather than the combined action, and the save placed directly after
    # the download rather than left to a post step. `actions/cache` does not save when
    # the job has failed, and this job fails by design whenever a run misses the
    # fixed-share rule - so the combined action re-downloaded 400 MB on every calibration
    # dispatch, which is exactly the run you make several of.
    - name: Restore the stock Spark distribution
      id: cache-stock
      uses: actions/cache/restore@v5
      with:
        path: ~/stock-spark
        key: stock-spark-${{ env.STOCK_VERSION }}-hadoop3

    - name: Download the stock Spark distribution
      if: ${{ steps.cache-stock.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        mkdir -p ~/stock-spark && cd ~/stock-spark
        TGZ="spark-${STOCK_VERSION}-bin-hadoop3.tgz"
        BASE="https://dlcdn.apache.org/spark/spark-${STOCK_VERSION}"
        curl -fsSLO "$BASE/$TGZ"
        # The checksum is the release's own, served beside it; a truncated download must
        # fail here rather than three hours later as a baseline nobody can reproduce.
        # Apache has served these in two formats over the years - `sha512sum` output, and
        # `gpg --print-md SHA512`, which is spaced hex over several lines and which
        # `sha512sum -c` cannot read - so the hash is extracted rather than piped.
        curl -fsSLO "$BASE/$TGZ.sha512"
        WANT="$(tr -d ' \n' < "$TGZ.sha512" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{128}' | head -1)"
        GOT="$(sha512sum "$TGZ" | cut -d' ' -f1)"
        if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
          echo "::error::checksum mismatch for $TGZ (want '$WANT' got '$GOT')"
          exit 1
        fi
        tar -xzf "$TGZ" && rm -f "$TGZ" "$TGZ.sha512"

    - name: Save the stock Spark distribution
      if: ${{ steps.cache-stock.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ~/stock-spark
        key: stock-spark-${{ env.STOCK_VERSION }}-hadoop3

    - name: Restore the vecruntime distribution
      if: ${{ inputs.vecruntime }}
      id: cache-vecruntime
      uses: actions/cache/restore@v5
      with:
        path: ~/vecruntime-spark
        key: vecruntime-${{ env.VECRUNTIME_VERSION }}-spark-${{ env.VECRUNTIME_SPARK_VERSION }}-hadoop-client-${{ env.VECRUNTIME_HADOOP_CLIENT }}

    # Two homes from one release: stock Spark 4.1.3 with the Hadoop client JDK 25 needs, the
    # control, and the same with the plugin jar in its jars directory. Every file is checked
    # against the checksum its publisher serves beside it.
    - name: Assemble the vecruntime distribution
      if: ${{ inputs.vecruntime && steps.cache-vecruntime.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        mkdir -p ~/vecruntime-spark && cd ~/vecruntime-spark
        V="$VECRUNTIME_SPARK_VERSION"; TGZ="spark-${V}-bin-hadoop3.tgz"
        # The mirror first, which is fast while the release is current; the archive keeps every
        # release but serves slowly. The checksum comes from the archive either way.
        curl -fsSLO "https://dlcdn.apache.org/spark/spark-${V}/$TGZ" \
          || curl -fsSLO "https://archive.apache.org/dist/spark/spark-${V}/$TGZ"
        curl -fsSLO "https://archive.apache.org/dist/spark/spark-${V}/$TGZ.sha512"
        WANT="$(tr -d ' \n' < "$TGZ.sha512" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{128}' | head -1)"
        GOT="$(sha512sum "$TGZ" | cut -d' ' -f1)"
        [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "::error::checksum mismatch for $TGZ"; exit 1; }
        tar -xzf "$TGZ" && rm -f "$TGZ" "$TGZ.sha512"
        STOCK="spark-${V}-bin-hadoop3"
        H="$VECRUNTIME_HADOOP_CLIENT"
        for a in hadoop-client-api hadoop-client-runtime; do
          URL="https://repo1.maven.org/maven2/org/apache/hadoop/$a/$H/$a-$H.jar"
          curl -fsSL -o "$a-$H.jar" "$URL"
          [ "$(curl -fsSL "$URL.sha1")" = "$(sha1sum "$a-$H.jar" | cut -d' ' -f1)" ] \
            || { echo "::error::checksum mismatch for $a-$H.jar"; exit 1; }
          rm -f "$STOCK"/jars/$a-*.jar && mv "$a-$H.jar" "$STOCK/jars/"
        done
        cp -a "$STOCK" "vecruntime-${VECRUNTIME_VERSION}"
        R="https://github.com/vecruntime/vecruntime/releases/download/v${VECRUNTIME_VERSION}"
        JAR="vecruntime-spark_2.13-${VECRUNTIME_VERSION}.jar"
        curl -fsSLO "$R/$JAR" && curl -fsSLO "$R/SHA256SUMS"
        grep " $JAR\$" SHA256SUMS | sha256sum -c - || { echo "::error::checksum mismatch for $JAR"; exit 1; }
        mv "$JAR" "vecruntime-${VECRUNTIME_VERSION}/jars/" && rm -f SHA256SUMS

    - name: Save the vecruntime distribution
      if: ${{ inputs.vecruntime && steps.cache-vecruntime.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ~/vecruntime-spark
        key: vecruntime-${{ env.VECRUNTIME_VERSION }}-spark-${{ env.VECRUNTIME_SPARK_VERSION }}-hadoop-client-${{ env.VECRUNTIME_HADOOP_CLIENT }}

    - name: Run the surface
      env:
        ROWS: ${{ inputs.rows }}
        PARTITIONS: ${{ inputs.partitions }}
        DRIVER_MEMORY: ${{ inputs.driver-memory }}
        ONLY: ${{ inputs.only }}
        SHARD: ${{ inputs.shard }}
        BENCHMARK: ${{ inputs.benchmark }}
        INPUT: ${{ inputs.input }}
        EXTRA_CONFS: ${{ inputs.extra-confs }}
        MAX_FIXED_SHARE: ${{ inputs.max-fixed-share }}
        VECRUNTIME: ${{ inputs.vecruntime }}
      run: |
        set -euo pipefail
        STOCK="$HOME/stock-spark/spark-${STOCK_VERSION}-bin-hadoop3"
        J17="${JAVA_HOME_17_X64}"; J25="${JAVA_HOME_25_X64}"
        ARGS=(--rows "$ROWS" --partitions "$PARTITIONS" --driver-memory "$DRIVER_MEMORY")
        # --force, and the reason is recorded rather than the gate weakened: the canary
        # compares this machine against dev/varka_canary/baseline-<host>.txt and exits 2
        # when there is none, which is every runner, since the hostname is per-dispatch.
        # The file's canary line then reads OFF, which tells a reader what the absolute
        # numbers are worth. See VARKA-62.md 11.4.
        ARGS+=(--force --skip-build)
        [ -n "$MAX_FIXED_SHARE" ] && ARGS+=(--max-fixed-share "$MAX_FIXED_SHARE")
        [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
        [ -n "$SHARD" ] && ARGS+=(--shard "$SHARD")
        # Guarded like ONLY and SHARD above it: an empty value would pass
        # `--benchmark ""` and the shell driver would reject it.
        [ -n "$BENCHMARK" ] && ARGS+=(--benchmark "$BENCHMARK")
        [ -n "$INPUT" ] && ARGS+=(--input "$INPUT")
        # An arm's third field is a comma list of confs, `varka` among them: extra confs open
        # that field on the arms that have none and extend it on the one that does.
        OPEN="${EXTRA_CONFS:+:$EXTRA_CONFS}"; MORE="${EXTRA_CONFS:+,$EXTRA_CONFS}"
        # vecruntime's two arms when asked for, on the Parquet input it reads (VARKA-202).
        OTHERS=()
        if [ "$VECRUNTIME" = true ]; then
          [ "$INPUT" = parquet ] \
            || { echo "::error::the vecruntime arms read Parquet only; dispatch with input parquet"; exit 1; }
          VR="$HOME/vecruntime-spark"
          OTHERS=("spark-${VECRUNTIME_SPARK_VERSION}-jdk25=$VR/spark-${VECRUNTIME_SPARK_VERSION}-bin-hadoop3:$J25$OPEN"
            "vecruntime-${VECRUNTIME_VERSION}-jdk25=$VR/vecruntime-${VECRUNTIME_VERSION}:$J25:vecruntime$MORE")
        fi
        # Varka last: the comparison table's ratios are the last file against the others.
        dev/varka_bench_surface.sh "${ARGS[@]}" \
          "spark-${STOCK_VERSION}-jdk17=$STOCK:$J17$OPEN" \
          "spark-${STOCK_VERSION}-jdk25=$STOCK:$J25$OPEN" \
          "${OTHERS[@]}" \
          "varka-off-jdk25=$PWD:$J25$OPEN" \
          "varka-jdk25=$PWD:$J25:varka$MORE"

    # `!cancelled()` and not the default, because the step this follows fails on purpose:
    # a run whose fixed share is over the ceiling has still done every measurement, and
    # those numbers are how the next row count gets chosen. Without this the surface runs
    # for twenty minutes and uploads nothing, which is what happened on the first
    # calibration dispatch.
    - name: Tar the results
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        mkdir -p target
        tar -cvf target/varka-surface-results.tar sql/varka/bench/benchmarks

    - name: Upload the results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        # Named for the shard, because collecting a sharded run downloads every artifact of it
        # into one directory and a single name would leave one shard standing.
        name: varka-surface-results${{ steps.tag.outputs.slug }}
        path: target/varka-surface-results.tar

    # Always uploaded above - `!cancelled()` is what makes that true - and committed only
    # on request, so a run that fails the fixed-share rule still leaves its evidence.
    # Never from a shard: that file is a fraction of the surface, and the merge is what makes
    # a committable one. dev/varka_bench_merge.py does the joining, off the runner.
    - name: Commit the results
      if: ${{ inputs.create-commit && success() && !inputs.shard }}
      run: |
        set -euo pipefail
        git config --local user.name "${{ github.actor }}"
        git config --local user.email "${{ github.actor }}@users.noreply.github.com"
        git add sql/varka/bench/benchmarks
        git commit -m "Varka ${{ inputs.benchmark }} benchmark results (${{ inputs.rows }} rows)"
        for i in {1..5}; do
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }}
          if git push origin ${{ github.ref_name }}:${{ github.ref_name }}; then
            exit 0
          fi
          sleep 3
        done
        echo "::error::failed to push after 5 attempts"
        exit 1
