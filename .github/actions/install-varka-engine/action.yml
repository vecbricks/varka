name: 'Install the Varka engine'
description: >-
  Build sql/varka/engine and install it into the local Maven repository.
  sql/catalyst and sql/core declare a test-scope dependency on
  org.apache.spark.varka:varka-engine. A Maven build resolves it from the
  reactor, but sbt resolves it from the local Maven repository, so an sbt job
  still fails to resolve the artifact before compiling anything unless this has
  run. Must run after the job's JDK is installed: the engine targets release 25.
inputs:
  run-tests:
    description: >-
      Run the engine test suite as part of the install. Off by default so the
      jobs that only need the jar stay fast; the dedicated varka-engine job
      turns it on.
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Check the engine builds against Spark's Arrow
      shell: bash
      run: ./dev/check_varka_arrow_version.py
    - name: Install the Varka engine into the local Maven repository
      shell: bash
      run: |
        if [ "${{ inputs.run-tests }}" = "true" ]; then
          ./build/mvn -B -f sql/varka/engine/pom.xml install
        else
          ./build/mvn -B -f sql/varka/engine/pom.xml -Dmaven.test.skip=true install
        fi
