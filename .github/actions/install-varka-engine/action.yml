name: 'Install the Varka engine'
description: >-
  Build sql/varka/engine and install it into the local Maven repository.
  sql/catalyst and sql/core declare a test-scope dependency on
  org.apache.spark.varka:varka-engine. A build of the whole reactor resolves it
  from the reactor, and so does sbt, which reads its projects from the same
  poms - but the Maven test jobs build a subset with `-pl` and no `-am`, and
  those resolve it from the local Maven repository. Must run after the job's JDK
  is installed: the engine targets release 25.
inputs:
  run-tests:
    description: >-
      Run the engine test suite as part of the install. Off by default so the
      jobs that only need the jar stay fast; the dedicated varka-engine job
      turns it on.
    required: false
    default: 'false'
  cache:
    description: >-
      Restore the local Maven repository the engine build needs (Maven's plugins
      and the engine's dependencies, about 35 MB) from a cache of its own, and
      install offline when the restore is an exact hit. Off only for jobs that
      already restore Spark's own Maven repository into ~/.m2/repository
      (maven_test.yml): the save right after the install would snapshot that
      whole repository under this small cache's key.
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Check the engine builds against Spark's Arrow
      shell: bash
      run: ./dev/check_varka_arrow_version.py
    # The key hashes the engine pom alone, which pins every plugin the build
    # runs, so the pom fixes the set of artifacts the build resolves; bump the
    # v1 to discard an entry that turns out to lack one. The mode is part of
    # the key because running the tests resolves more (surefire's JUnit
    # provider) than skipping them does, and the test mode falls back to the
    # build entry of the same pom. The entry also holds the engine jar of the
    # commit that saved it, which every install overwrites. Restore, install
    # and save are separate steps so that the save runs right after the
    # install, before anything later in the job adds to the repository.
    #
    # Where that repository is: Maven's default is ${user.home}/.m2/repository,
    # and Java reads user.home from the uid's passwd entry, not from $HOME.
    # actions/cache expands ~ with $HOME. On a host runner both are
    # /home/runner; in a container job GitHub sets HOME=/github/home while the
    # uid is root, so a cache restored to ~/.m2 landed where Maven never looked
    # and every container job's offline install failed and went online (run
    # 39017334406). The path is therefore asked of the JVM, and spelled
    # ~/.m2/repository wherever the two agree, so that the host jobs' cache
    # version, which hashes the path as written, stays what it was.
    - name: Find the local Maven repository
      id: m2-path
      if: inputs.cache == 'true'
      shell: bash
      run: |
        user_home=$("${JAVA_HOME:+$JAVA_HOME/bin/}java" -XshowSettings:properties -version 2>&1 \
          | sed -n 's/^ *user\.home = //p' | head -n 1)
        if [ -z "$user_home" ] || [ "$user_home" = "$HOME" ]; then
          # A literal tilde on purpose: actions/cache expands it, and the path as
          # written is part of the cache version the host jobs' entries carry.
          # shellcheck disable=SC2088
          repository='~/.m2/repository'
        else
          repository="$user_home/.m2/repository"
        fi
        echo "Maven's local repository: $repository (user.home=${user_home:-?}, HOME=$HOME)"
        echo "repository=$repository" >> "$GITHUB_OUTPUT"
    - name: Restore the engine's local Maven repository
      id: m2-restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.m2-path.outputs.repository }}
        key: >-
          varka-engine-m2-v1-${{ runner.os }}-${{ inputs.run-tests == 'true' && 'test' || 'build'
          }}-${{ hashFiles('sql/varka/engine/pom.xml') }}
        restore-keys: >-
          ${{ inputs.run-tests == 'true' && format('varka-engine-m2-v1-{0}-build-{1}', runner.os,
          hashFiles('sql/varka/engine/pom.xml')) || '' }}
    - name: Install the Varka engine into the local Maven repository
      shell: bash
      env:
        RUN_TESTS: ${{ inputs.run-tests }}
        CACHE_HIT: ${{ steps.m2-restore.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.m2-restore.outputs.cache-primary-key }}
      run: |
        mvn_args=(-B -f sql/varka/engine/pom.xml)
        if [ "$RUN_TESTS" != "true" ]; then
          mvn_args+=(-Dmaven.test.skip=true)
        fi
        log=$(mktemp)
        # Runs one install, keeping its output in $log so that a failure can be
        # told apart: only a failure to resolve an artifact is worth retrying,
        # a compile or test failure fails the step at once.
        run_install() {
          ./build/mvn "$@" "${mvn_args[@]}" install 2>&1 | tee "$log"
        }
        # An exact hit holds everything the build resolves, so the install runs
        # offline and downloads nothing; an offline install that fails to
        # resolve an artifact means the entry is stale, and goes online.
        if [ "$CACHE_HIT" = "true" ]; then
          echo "Local Maven repository restored from $CACHE_KEY: installing offline (-o)"
          if run_install -o; then
            exit 0
          fi
          if ! grep -q "in offline mode" "$log"; then
            exit 1
          fi
          echo "::warning::The cache restored from $CACHE_KEY lacks an artifact the" \
            "engine build needs; installing online (bump the key's version to replace it)"
        elif [ -n "$CACHE_KEY" ]; then
          echo "No exact cache hit for $CACHE_KEY: installing online, then saving the cache"
        fi
        # Online, a transient Maven Central miss (16 October 2026: "Could not
        # transfer artifact") is retried twice before the step fails.
        for attempt in 1 2 3; do
          if run_install; then
            exit 0
          fi
          if [ "$attempt" = 3 ] || ! grep -q "Could not transfer artifact" "$log"; then
            exit 1
          fi
          echo "::warning::Maven could not download an artifact (attempt $attempt of 3);" \
            "retrying in 30 seconds"
          sleep 30
        done
    - name: Save the engine's local Maven repository
      if: inputs.cache == 'true' && steps.m2-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.m2-path.outputs.repository }}
        key: ${{ steps.m2-restore.outputs.cache-primary-key }}
