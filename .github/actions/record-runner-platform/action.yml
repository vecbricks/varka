name: 'Record the CPU and the vector width'
description: >-
  Write the runner's CPU model and core count, its AVX, SVE and ASIMD flags, and
  the vector width HotSpot uses (MaxVectorSize, UseAVX, UseSVE) to the job's
  step summary and to platform.txt in the given directory, so that a result can
  be read against the machine it ran on. GitHub's runner pool mixes 256-bit and
  512-bit x86 machines, and C2 emits different vector code for each. Run it
  after the job's JDK is installed and before any kernel runs, and upload the
  directory with the job's results.
inputs:
  dir:
    description: >-
      The directory platform.txt is written to, created if missing; the job
      uploads it, or a path inside it, with its logs.
    required: true
runs:
  using: 'composite'
  steps:
    - name: Record the CPU and the vector width
      shell: bash
      env:
        PLATFORM_DIR: ${{ inputs.dir }}
      run: |
        mkdir -p "$PLATFORM_DIR"
        # The step only records, so nothing in it may fail the job. GitHub runs it under
        # `bash -eo pipefail`, so lscpu, which a runner may lack, is guarded, and the rest fails
        # only inside command substitutions, which leave echo's status alone. An aarch64 runner
        # may report no model name, only the vendor.
        info=$(lscpu 2>/dev/null) || true
        model=$(sed -n 's/^Model name: *//p' <<< "$info" | head -n 1)
        [ -n "$model" ] || model=$(sed -n 's/^Vendor ID: *//p' <<< "$info" | head -n 1)
        [ -n "$model" ] || model=unknown
        {
          echo "## Runner CPU and vector width"
          echo "CPU: $model, $(nproc) cores"
          echo "AVX/SVE flags: $(tr ' ' '\n' <<< "$info" | grep -E '^avx|^sve|^asimd' | sort -u \
            | tr '\n' ' ')"
          echo "JVM: $(java -XX:+PrintFlagsFinal -version 2>/dev/null \
            | grep -E ' (MaxVectorSize|UseAVX|UseSVE) ' | awk '{print $2 "=" $4}' | tr '\n' ' ')"
        } | tee "$PLATFORM_DIR/platform.txt" | tee -a "$GITHUB_STEP_SUMMARY"
